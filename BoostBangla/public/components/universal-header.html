<script>
// ============================================
// PREMIUM UNIVERSAL HEADER - COMPLETE FUNCTIONALITY
// Sticky Header | Search | Notifications | Balance
// ============================================

(function() {
    'use strict';
    
    // DOM Elements
    const header = document.getElementById('premiumHeader');
    const menuToggle = document.getElementById('headerMenuToggle');
    const searchInput = document.getElementById('globalSearchInput');
    const searchWrapper = document.querySelector('.search-bar-wrapper');
    const searchDropdown = document.getElementById('searchDropdown');
    const notificationTrigger = document.getElementById('headerNotificationTrigger');
    const notificationCenter = document.querySelector('.notification-center');
    const balanceWidget = document.querySelector('.balance-widget');
    const balanceTrigger = document.getElementById('balanceTriggerBtn');
    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const readingProgress = document.getElementById('readingProgress');
    const mobileSearchOverlay = document.getElementById('mobileSearchOverlay');
    
    // State
    let unreadCount = 0;
    let notifications = [];
    let currentFilter = 'all';
    let searchTimeout;
    
    // ============================================
    // STICKY HEADER SCROLL EFFECT
    // ============================================
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
    
    // ============================================
    // READING PROGRESS BAR
    // ============================================
    window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        const progressBar = document.querySelector('.progress-bar');
        if (progressBar) {
            progressBar.style.width = scrolled + '%';
        }
    });
    
    // ============================================
    // MENU TOGGLE (Mobile & Desktop Collapse)
    // ============================================
    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            const sidebar = document.getElementById('premiumSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) {
                if (window.innerWidth <= 768) {
                    const isOpen = sidebar.classList.contains('open');
                    if (isOpen) {
                        sidebar.classList.remove('open');
                        backdrop?.classList.remove('active');
                        document.body.style.overflow = '';
                    } else {
                        sidebar.classList.add('open');
                        backdrop?.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    }
                } else {
                    document.body.classList.toggle('sidebar-collapsed');
                    const isCollapsed = document.body.classList.contains('sidebar-collapsed');
                    localStorage.setItem('sidebarCollapsed', isCollapsed);
                }
            }
        });
    }
    
    // ============================================
    // GLOBAL SEARCH FUNCTIONALITY
    // ============================================
    if (searchInput) {
        // Focus on Ctrl+K
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                if (window.innerWidth <= 768) {
                    mobileSearchOverlay?.classList.add('active');
                    document.getElementById('mobileSearchInput')?.focus();
                } else {
                    searchInput.focus();
                }
            }
            
            // Escape to close search
            if (e.key === 'Escape') {
                searchInput.blur();
                searchWrapper?.classList.remove('active');
            }
        });
        
        // Search input handler
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length > 1) {
                searchTimeout = setTimeout(() => performSearch(query), 300);
                searchWrapper?.classList.add('active');
            } else {
                searchWrapper?.classList.remove('active');
            }
        });
        
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim().length > 1) {
                searchWrapper?.classList.add('active');
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!searchWrapper?.contains(e.target)) {
                searchWrapper?.classList.remove('active');
            }
        });
    }
    
    async function performSearch(query) {
        const resultsContainer = document.getElementById('searchDropdownResults');
        if (!resultsContainer) return;
        
        // Simulate search results (replace with actual API call)
        const mockResults = [
            { type: 'order', id: 'ORD-001', title: 'Order #ORD-001', desc: 'Facebook likes - 1000', icon: 'fa-shopping-cart' },
            { type: 'service', id: 'SVC-001', title: 'Facebook Followers', desc: 'High quality followers', icon: 'fa-layer-group' },
            { type: 'transaction', id: 'TXN-001', title: 'Deposit of ৳500', desc: 'Completed on Jan 15, 2025', icon: 'fa-exchange-alt' },
        ];
        
        resultsContainer.innerHTML = mockResults.map(result => `
            <div class="search-result-item" onclick="window.location.href='/public/pages/dashboard/${result.type}s.html'">
                <div class="result-icon">
                    <i class="fas ${result.icon}"></i>
                </div>
                <div class="result-info">
                    <div class="result-title">${result.title}</div>
                    <div class="result-desc">${result.desc}</div>
                </div>
            </div>
        `).join('');
    }
    
    // ============================================
    // NOTIFICATION SYSTEM
    // ============================================
    async function loadNotifications() {
        if (typeof firebase === 'undefined' || !firebase.auth) {
            setTimeout(loadNotifications, 500);
            return;
        }
        
        const user = firebase.auth().currentUser;
        if (!user) return;
        
        try {
            const db = firebase.firestore();
            const userDoc = await db.collection('users').doc(user.uid).get();
            const isAdmin = userDoc.data()?.isAdmin === true;
            const collectionName = isAdmin ? 'adminNotifications' : 'notifications';
            
            let query = db.collection(collectionName).orderBy('createdAt', 'desc').limit(30);
            if (!isAdmin) {
                query = query.where('userId', '==', user.uid);
            }
            
            query.onSnapshot((snapshot) => {
                notifications = [];
                snapshot.forEach((doc) => {
                    notifications.push({ id: doc.id, ...doc.data() });
                });
                
                unreadCount = notifications.filter(n => !n.read).length;
                updateNotificationUI();
            });
        } catch (error) {
            console.error('Error loading notifications:', error);
        }
    }
    
    function updateNotificationUI() {
        const dot = document.getElementById('headerNotificationDot');
        const countEl = document.getElementById('headerNotificationCount');
        
        if (unreadCount > 0) {
            if (dot) dot.style.display = 'block';
            if (countEl) {
                countEl.style.display = 'flex';
                countEl.textContent = unreadCount > 99 ? '99+' : unreadCount;
            }
        } else {
            if (dot) dot.style.display = 'none';
            if (countEl) countEl.style.display = 'none';
        }
        
        renderNotifications();
    }
    
    function renderNotifications() {
        const container = document.getElementById('notificationList');
        if (!container) return;
        
        let filtered = [...notifications];
        if (currentFilter !== 'all') {
            filtered = filtered.filter(n => n.type === currentFilter);
        }
        
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-notifications" style="text-align: center; padding: 60px 20px;">
                    <i class="fas fa-bell-slash" style="font-size: 48px; color: #cbd5e1; margin-bottom: 16px;"></i>
                    <p style="color: #6b7280;">No notifications</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = filtered.slice(0, 10).map(notif => `
            <div class="notification-item ${!notif.read ? 'unread' : ''}" onclick="markNotificationRead('${notif.id}')">
                <div class="notification-icon ${notif.type}">
                    ${getNotificationEmoji(notif.type)}
                </div>
                <div class="notification-content">
                    <div class="notification-title">${escapeHtml(notif.title)}</div>
                    <div class="notification-message">${escapeHtml(notif.message)}</div>
                    <div class="notification-time">
                        <span>${getRelativeTime(notif.createdAt)}</span>
                        ${!notif.read ? '<span class="unread-dot"></span>' : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    function getNotificationEmoji(type) {
        const icons = {
            order: '📦',
            payment: '💰',
            system: '⚙️',
            promotion: '🎁'
        };
        return icons[type] || '🔔';
    }
    
    function getRelativeTime(timestamp) {
        if (!timestamp) return 'Just now';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const diffMs = Date.now() - date;
        const diffMins = Math.floor(diffMs / 60000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins} min ago`;
        if (diffMins < 1440) return `${Math.floor(diffMins / 60)} hours ago`;
        return `${Math.floor(diffMins / 1440)} days ago`;
    }
    
    window.markNotificationRead = async function(id) {
        if (typeof firebase === 'undefined') return;
        const user = firebase.auth().currentUser;
        if (!user) return;
        
        try {
            const db = firebase.firestore();
            const userDoc = await db.collection('users').doc(user.uid).get();
            const isAdmin = userDoc.data()?.isAdmin === true;
            const collectionName = isAdmin ? 'adminNotifications' : 'notifications';
            await db.collection(collectionName).doc(id).update({ read: true });
        } catch (error) {
            console.error('Error marking notification as read:', error);
        }
    };
    
    window.markAllNotificationsRead = async function() {
        if (typeof firebase === 'undefined') return;
        const user = firebase.auth().currentUser;
        if (!user) return;
        
        const unreadNotifs = notifications.filter(n => !n.read);
        if (unreadNotifs.length === 0) return;
        
        try {
            const db = firebase.firestore();
            const userDoc = await db.collection('users').doc(user.uid).get();
            const isAdmin = userDoc.data()?.isAdmin === true;
            const collectionName = isAdmin ? 'adminNotifications' : 'notifications';
            
            const batch = db.batch();
            unreadNotifs.forEach(notif => {
                batch.update(db.collection(collectionName).doc(notif.id), { read: true });
            });
            await batch.commit();
        } catch (error) {
            console.error('Error marking all as read:', error);
        }
    };
    
    // ============================================
    // BALANCE WIDGET WITH ANIMATED COUNTER
    // ============================================
    let headerBalanceManagerBound = false;
    async function loadBalance() {
        // Use global balance manager if available
        if (typeof BALANCE_MANAGER !== 'undefined') {
            if (!headerBalanceManagerBound) {
                headerBalanceManagerBound = true;
                BALANCE_MANAGER.onChange((balance) => {
                    animateBalance(0, balance);
                });
            }
            const balance = BALANCE_MANAGER.getBalance();
            animateBalance(0, balance);
            BALANCE_MANAGER.refresh();
            return;
        }
        
        // Fallback to direct API call
        try {
            let userId = null;
            
            if (typeof firebase !== 'undefined' && firebase.auth) {
                const user = firebase.auth().currentUser;
                if (user) {
                    userId = user.uid;
                }
            }
            
            if (!userId) {
                userId = localStorage.getItem('userId');
            }
            
            if (!userId) {
                setTimeout(loadBalance, 500);
                return;
            }
            
            const response = await fetch(
                `/public/php/api-proxy.php?action=get_balance&user_id=${encodeURIComponent(userId)}`
            );
            
            if (!response.ok) throw new Error('Failed to fetch balance');
            
            const result = await response.json();
            let balance = Number(result.balance || 0);

            if (!result.wallet_exists && balance === 0 && typeof firebase !== 'undefined' && firebase.firestore && userId) {
                const userDoc = await firebase.firestore().collection('users').doc(userId).get();
                balance = Number(userDoc.data()?.balance || 0);
            }
            
            animateBalance(0, balance);
        } catch (error) {
            console.error('Error loading balance:', error);
            setTimeout(loadBalance, 2000);
        }
    }
    
    function animateBalance(start, end) {
        const element = document.getElementById('headerBalanceValue');
        if (!element) return;
        
        const duration = 800;
        const startTime = performance.now();
        
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOutCubic = 1 - Math.pow(1 - progress, 3);
            const currentValue = Math.floor(start + (end - start) * easeOutCubic);
            
            element.textContent = currentValue.toLocaleString();
            element.classList.add('count-up');
            
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                setTimeout(() => element.classList.remove('count-up'), 500);
            }
        }
        
        requestAnimationFrame(update);
    }
    
    // ============================================
    // USER DATA LOAD
    // ============================================
    async function loadHeaderUserData() {
        if (typeof firebase === 'undefined' || !firebase.auth) {
            setTimeout(loadHeaderUserData, 500);
            return;
        }
        
        const user = firebase.auth().currentUser;
        if (!user) return;
        
        try {
            const db = firebase.firestore();
            const userDoc = await db.collection('users').doc(user.uid).get();
            const userData = userDoc.data();
            
            const displayName = userData?.displayName || userData?.username || user.email?.split('@')[0] || 'User';
            const avatarURL = userData?.avatarURL;
            const isAdmin = userData?.isAdmin;
            
            // Update user name
            const userNameEl = document.getElementById('headerUserName');
            if (userNameEl) userNameEl.textContent = displayName;
            
            // Update role
            const userRoleEl = document.getElementById('headerUserRole');
            if (userRoleEl) userRoleEl.textContent = isAdmin ? 'Admin' : 'Member';
            
            // Update avatar
            const avatarImg = document.getElementById('headerUserAvatar');
            const avatarInitials = document.getElementById('headerAvatarInitials');
            
            if (avatarURL) {
                avatarImg.src = avatarURL;
                avatarImg.style.display = 'block';
                if (avatarInitials) avatarInitials.style.display = 'none';
            } else if (avatarInitials) {
                avatarImg.style.display = 'none';
                avatarInitials.style.display = 'flex';
                avatarInitials.textContent = displayName.charAt(0).toUpperCase();
            }
            
            // Load user menu component dynamically
            loadUserMenuComponent();
            
        } catch (error) {
            console.error('Error loading user data:', error);
        }
    }
    
    function loadUserMenuComponent() {
        const container = document.getElementById('userDropdownContainer');
        if (!container) return;
        
        // Check if user-menu component exists in the page
        const userMenuComponent = document.getElementById('premiumUserMenu');
        if (userMenuComponent) {
            container.innerHTML = '';
            container.appendChild(userMenuComponent.cloneNode(true));
        }
    }
    
    // ============================================
    // EVENT LISTENERS SETUP
    // ============================================
    function setupEventListeners() {
        // Notification trigger
        if (notificationTrigger && notificationCenter) {
            notificationTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                notificationCenter.classList.toggle('active');
            });
            
            document.addEventListener('click', (e) => {
                if (!notificationCenter.contains(e.target)) {
                    notificationCenter.classList.remove('active');
                }
            });
        }
        
        // Filter chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderNotifications();
            });
        });
        
        // Mark all read button
        const markAllBtn = document.getElementById('markAllReadBtn');
        if (markAllBtn) {
            markAllBtn.addEventListener('click', window.markAllNotificationsRead);
        }
        
        // Balance widget
        if (balanceTrigger && balanceWidget) {
            balanceTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                balanceWidget.classList.toggle('active');
            });
            
            document.addEventListener('click', (e) => {
                if (!balanceWidget.contains(e.target)) {
                    balanceWidget.classList.remove('active');
                }
            });
            
            // Quick add amounts
            document.querySelectorAll('.amount-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    if (chip.dataset.custom === 'true') {
                        document.querySelector('.quick-add-custom').style.display = 'block';
                    } else {
                        window.location.href = `/public/pages/dashboard/add-funds.html?amount=${chip.dataset.amount}`;
                    }
                });
            });
            
            const closeQuickAdd = document.getElementById('closeQuickAdd');
            if (closeQuickAdd) {
                closeQuickAdd.addEventListener('click', () => {
                    balanceWidget.classList.remove('active');
                });
            }
        }
        
        // User menu trigger
        if (userMenuTrigger) {
            userMenuTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                userMenuTrigger.classList.toggle('active');
            });
            
            document.addEventListener('click', (e) => {
                if (!userMenuTrigger.contains(e.target) && !document.getElementById('userDropdownContainer')?.contains(e.target)) {
                    userMenuTrigger.classList.remove('active');
                }
            });
        }
        
        // Mobile search
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        if (closeSearchBtn) {
            closeSearchBtn.addEventListener('click', () => {
                mobileSearchOverlay?.classList.remove('active');
            });
        }
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
        setupEventListeners();
        loadBalance();
        loadHeaderUserData();
        loadNotifications();
        
        // Check for Firebase
        const checkFirebase = setInterval(() => {
            if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                clearInterval(checkFirebase);
                loadBalance();
                loadHeaderUserData();
                loadNotifications();
                
                firebase.auth().onAuthStateChanged((user) => {
                    if (user) {
                        loadBalance();
                        loadHeaderUserData();
                        loadNotifications();
                    }
                });
            }
        }, 500);
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
