<script>
(function() {
    'use strict';

    function ready(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function() {
        const navbar = document.getElementById('bbNavbar') || document.querySelector('.bb-navbar');
        const mobileMenuBtn = document.getElementById('landingMobileMenuBtn');
        const mobileDrawer = document.getElementById('landingMobileDrawer');
        const drawerOverlay = document.getElementById('landingDrawerOverlay');
        const closeDrawerBtn = document.getElementById('closeMobileDrawer');
        const darkModeToggle = document.getElementById('landingDarkModeToggle');
        const progressBar = document.getElementById('landingReadingProgress');
        const logoutDrawerBtn = document.getElementById('drawerLogoutBtn');

        function updateScrollState() {
            if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 24);

            if (progressBar) {
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const percent = height > 0 ? (window.scrollY / height) * 100 : 0;
                progressBar.style.width = percent + '%';
            }
        }

        window.addEventListener('scroll', updateScrollState, { passive: true });
        updateScrollState();

        function openDrawer() {
            if (!mobileDrawer || !drawerOverlay) return;
            mobileDrawer.classList.add('open');
            mobileDrawer.setAttribute('aria-hidden', 'false');
            drawerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
            if (!mobileDrawer || !drawerOverlay) return;
            mobileDrawer.classList.remove('open');
            mobileDrawer.setAttribute('aria-hidden', 'true');
            drawerOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', openDrawer);
        if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeDrawer);
        if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);
        document.querySelectorAll('.bb-drawer-link').forEach(link => link.addEventListener('click', closeDrawer));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDrawer();
        });

        function updateDarkIcon(isDark) {
            if (!darkModeToggle) return;
            const icon = darkModeToggle.querySelector('i');
            if (!icon) return;
            icon.classList.toggle('fa-moon', !isDark);
            icon.classList.toggle('fa-sun', isDark);
        }

        const initialDark = localStorage.getItem('darkMode') === 'true';
        document.body.classList.toggle('dark-mode', initialDark);
        updateDarkIcon(initialDark);

        if (darkModeToggle) {
            darkModeToggle.addEventListener('click', () => {
                const isDark = !document.body.classList.contains('dark-mode');
                document.body.classList.toggle('dark-mode', isDark);
                localStorage.setItem('darkMode', isDark ? 'true' : 'false');
                updateDarkIcon(isDark);
            });
        }

        function normalizePath(path) {
            if (!path) return '';
            if (path === '/') return '/index.html';
            return path.split('?')[0].split('#')[0];
        }

        function setActiveNavLink() {
            const current = normalizePath(window.location.pathname);
            document.querySelectorAll('.bb-nav-link, .bb-drawer-link').forEach(link => {
                const href = normalizePath(link.getAttribute('href'));
                const hrefName = href.split('/').pop();
                const currentName = current.split('/').pop();

                const isActive =
                    current === href ||
                    (href === '/index.html' && (current === '/' || current === '/index.html')) ||
                    (hrefName && currentName && hrefName === currentName);

                link.classList.toggle('active', !!isActive);
            });
        }
        setActiveNavLink();

        function updateLoggedOut() {
            const authButtons = document.getElementById('bbAuthButtons');
            const drawerAuthButtons = document.getElementById('drawerAuthButtons');
            const drawerUserActions = document.getElementById('drawerUserActions');
            const drawerUserInfo = document.getElementById('drawerUserInfo');

            if (authButtons) {
                authButtons.innerHTML = `
                    <a href="/public/pages/public/login.html" class="bb-btn bb-btn-outline">
                        <i class="fas fa-sign-in-alt"></i><span>Sign In</span>
                    </a>
                    <a href="/public/pages/public/signup.html" class="bb-btn bb-btn-primary">
                        <i class="fas fa-user-plus"></i><span>Sign Up</span>
                    </a>
                `;
            }

            if (drawerAuthButtons) drawerAuthButtons.style.display = 'flex';
            if (drawerUserActions) drawerUserActions.style.display = 'none';
            if (drawerUserInfo) drawerUserInfo.style.display = 'none';
        }

        function updateLoggedIn(user, userData = {}) {
            const authButtons = document.getElementById('bbAuthButtons');
            const drawerAuthButtons = document.getElementById('drawerAuthButtons');
            const drawerUserActions = document.getElementById('drawerUserActions');
            const drawerUserInfo = document.getElementById('drawerUserInfo');

            if (authButtons) {
                authButtons.innerHTML = `
                    <a href="/public/pages/dashboard/index.html" class="bb-btn bb-btn-primary">
                        <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
                    </a>
                `;
            }

            if (drawerAuthButtons) drawerAuthButtons.style.display = 'none';
            if (drawerUserActions) drawerUserActions.style.display = 'flex';
            if (drawerUserInfo) drawerUserInfo.style.display = 'flex';

            const displayName = userData.displayName || userData.username || (user.email ? user.email.split('@')[0] : 'User');
            const avatarURL = userData.avatarURL || userData.photoURL || user.photoURL;

            const userNameEl = document.getElementById('drawerUserName');
            const userEmailEl = document.getElementById('drawerUserEmail');
            const avatarImg = document.getElementById('drawerAvatarImg');
            const initialsSpan = document.getElementById('drawerInitials');

            if (userNameEl) userNameEl.textContent = displayName;
            if (userEmailEl) userEmailEl.textContent = user.email || 'Signed in';

            if (avatarURL && avatarImg) {
                avatarImg.src = avatarURL;
                avatarImg.style.display = 'block';
                if (initialsSpan) initialsSpan.style.display = 'none';
            } else {
                if (avatarImg) avatarImg.style.display = 'none';
                if (initialsSpan) {
                    initialsSpan.style.display = 'flex';
                    initialsSpan.textContent = displayName.charAt(0).toUpperCase();
                }
            }
        }

        if (typeof firebase !== 'undefined' && firebase.auth) {
            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) {
                    updateLoggedOut();
                    return;
                }

                let userData = {};
                try {
                    if (firebase.firestore) {
                        const doc = await firebase.firestore().collection('users').doc(user.uid).get();
                        userData = doc.exists ? (doc.data() || {}) : {};
                    }
                } catch (error) {
                    console.warn('Header user data load failed:', error);
                }

                updateLoggedIn(user, userData);
            });

            if (logoutDrawerBtn) {
                logoutDrawerBtn.addEventListener('click', async () => {
                    try {
                        await firebase.auth().signOut();
                        window.location.href = '/index.html';
                    } catch (error) {
                        console.error('Logout failed:', error);
                    }
                });
            }
        } else {
            updateLoggedOut();
        }
    });
})();
</script>
