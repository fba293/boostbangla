<script>
(function() {
    const sidebar = document.getElementById('premiumSidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    const closeBtn = document.getElementById('sidebarCloseBtn');
    const darkToggle = document.getElementById('sidebarDarkModeToggle');
    const logoutBtn = document.getElementById('sidebarLogoutBtn');
    const avatarUploadBtn = document.getElementById('sidebarAvatarUpload');
    
    // Mobile open/close
    function openSidebar() { sidebar.classList.add('open'); if(backdrop) backdrop.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeSidebar() { sidebar.classList.remove('open'); if(backdrop) backdrop.classList.remove('active'); document.body.style.overflow = ''; }
    function toggleSidebar() { if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar(); }
    
    if(closeBtn) closeBtn.onclick = closeSidebar;
    if(backdrop) backdrop.onclick = closeSidebar;
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
    });
    
    document.querySelectorAll('.nav-item').forEach(link => {
        link.onclick = () => { if(window.innerWidth <= 768) closeSidebar(); };
    });
    
    // Dark mode
    if(darkToggle){
        darkToggle.checked = localStorage.getItem('darkMode') === 'true';
        if(darkToggle.checked) document.body.classList.add('dark-mode');
        darkToggle.onchange = () => {
            document.body.classList.toggle('dark-mode', darkToggle.checked);
            localStorage.setItem('darkMode', darkToggle.checked);
        };
    }
    
    // Logout
    if(logoutBtn && typeof firebase !== 'undefined'){
        logoutBtn.onclick = () => firebase.auth().signOut().then(() => window.location.href = '/public/pages/public/login.html');
    }
    
    // Active link
    function setActiveLink(){
        const path = window.location.pathname;
        const currentPage = path.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-item').forEach(link => {
            const href = link.getAttribute('href');
            if (!href) {
                link.classList.remove('active');
                return;
            }
            const targetPage = href.split('/').pop();
            const isDashboardRoot = path.includes('/public/pages/dashboard/') && currentPage === 'index.html';
            const isExactMatch = currentPage === targetPage;
            if (isDashboardRoot && targetPage === 'index.html') link.classList.add('active');
            else if (isExactMatch) link.classList.add('active');
            else link.classList.remove('active');
        });
    }
    setActiveLink();
    
    function setFallbackUser() {
        const sidebarUserName = document.getElementById('sidebarUserName');
        const sidebarUserEmail = document.getElementById('sidebarUserEmail');
        const storedName = localStorage.getItem('username') || localStorage.getItem('displayName') || localStorage.getItem('userName');
        const storedEmail = localStorage.getItem('email') || localStorage.getItem('userEmail');
        if (sidebarUserName) sidebarUserName.innerText = storedName || (storedEmail ? storedEmail.split('@')[0] : 'User');
        if (sidebarUserEmail && storedEmail) sidebarUserEmail.innerText = storedEmail;
    }

    function bindUserData() {
        if (typeof firebase === 'undefined' || !firebase.auth || !firebase.firestore) {
            setFallbackUser();
            return false;
        }
        firebase.auth().onAuthStateChanged(async (user) => {
            if(user){
                try{
                    const db = firebase.firestore();
                    const sidebarAvatarImg = document.getElementById('sidebarUserAvatarImg');
                    const sidebarAvatarInitials = document.getElementById('sidebarAvatarInitials');
                    const sidebarBalanceUSD = document.getElementById('sidebarBalanceUSD');
                    const sidebarUserName = document.getElementById('sidebarUserName');
                    const sidebarUserEmail = document.getElementById('sidebarUserEmail');
                    if (sidebarUserName) sidebarUserName.innerText = user.displayName || user.email?.split('@')[0] || 'User';
                    if (sidebarUserEmail) sidebarUserEmail.innerText = user.email || 'user@example.com';

                    async function ensureStorageSdk(){
                        if (firebase.storage) return true;
                        await new Promise((resolve, reject) => {
                            const s = document.createElement('script');
                            s.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js';
                            s.onload = resolve;
                            s.onerror = reject;
                            document.head.appendChild(s);
                        });
                        return !!firebase.storage;
                    }

                    function compressImage(file) {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.readAsDataURL(file);
                            reader.onload = (e) => {
                                const img = new Image();
                                img.src = e.target.result;
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    let width = img.width;
                                    let height = img.height;
                                    const maxSize = 300;
                                    if(width > height && width > maxSize) {
                                        height = (height * maxSize) / width;
                                        width = maxSize;
                                    } else if(height > maxSize) {
                                        width = (width * maxSize) / height;
                                        height = maxSize;
                                    }
                                    canvas.width = width;
                                    canvas.height = height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, width, height);
                                    canvas.toBlob(resolve, 'image/jpeg', 0.8);
                                };
                                img.onerror = reject;
                            };
                            reader.onerror = reject;
                        });
                    }

                    if (avatarUploadBtn) {
                        avatarUploadBtn.onclick = async () => {
                            if (window.BOOSTBANGLA_AVATAR_MANAGER) {
                                window.BOOSTBANGLA_AVATAR_MANAGER.init();
                                document.querySelector('input[type="file"][accept*="image"]')?.click();
                                return;
                            }
                            const input = document.createElement('input');
                            input.type = 'file';
                            input.accept = 'image/jpeg,image/png,image/webp';
                            input.onchange = async (e) => {
                                const file = e.target.files && e.target.files[0];
                                if (!file) return;
                                if (!file.type.startsWith('image/')) return alert('Please select an image file');
                                if (file.size > 2 * 1024 * 1024) return alert('Image must be less than 2MB');
                                try {
                                    await ensureStorageSdk();
                                    if (!firebase.storage) throw new Error('Storage unavailable');
                                    const compressed = await compressImage(file);
                                    const storageRef = firebase.storage().ref();
                                    const fileName = `avatars/${user.uid}/avatar_${Date.now()}.jpg`;
                                    await storageRef.child(fileName).put(compressed);
                                    const downloadURL = await storageRef.child(fileName).getDownloadURL();
                                    await db.collection('users').doc(user.uid).update({
                                        avatarURL: downloadURL,
                                        avatarUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                    });
                                } catch (err) {
                                    console.error('Avatar upload error:', err);
                                    alert('Failed to upload image');
                                }
                            };
                            input.click();
                        };
                    }

                    // Load balance from PHP API instead of Firebase
                    let sidebarBalanceManagerBound = false;
                    async function loadSidebarBalance() {
                        if (window.BALANCE_MANAGER) {
                            if (!sidebarBalanceManagerBound) {
                                sidebarBalanceManagerBound = true;
                                window.BALANCE_MANAGER.onChange((balance) => {
                                    const valueEl = document.getElementById('sidebarUserBalance');
                                    if (valueEl) valueEl.innerText = Number(balance || 0).toLocaleString();
                                    if (sidebarBalanceUSD) sidebarBalanceUSD.innerText = `≈ $${(Number(balance || 0) / (window.CURRENT_USD_BDT_RATE || 120)).toFixed(2)} USD`;
                                });
                            }
                            await window.BALANCE_MANAGER.refresh();
                            return;
                        }

                        try {
                            const response = await fetch(
                                `/public/php/api-proxy.php?action=get_balance&user_id=${encodeURIComponent(user.uid)}`
                            );
                            
                            if (!response.ok) throw new Error('Failed to fetch balance');
                            
                            const result = await response.json();
                            let balance = Number(result.balance || 0);

                            if (!result.wallet_exists && balance === 0) {
                                const userDoc = await db.collection('users').doc(user.uid).get();
                                balance = Number(userDoc.data()?.balance || 0);
                            }
                            
                            document.getElementById('sidebarUserBalance').innerText = balance.toLocaleString();
                            if (sidebarBalanceUSD) sidebarBalanceUSD.innerText = `≈ $${(balance / (window.CURRENT_USD_BDT_RATE || 120)).toFixed(2)} USD`;
                        } catch (error) {
                            console.error('Error loading sidebar balance:', error);
                        }
                    }
                    
                    // Load balance immediately and refresh every 5 seconds
                    loadSidebarBalance();
                    setInterval(loadSidebarBalance, 5000);

                    // Load user data from Firebase (name, avatar)
                    db.collection('users').doc(user.uid).onSnapshot((doc) => {
                        if (!doc.exists) return;
                        const name = doc.data()?.username || user.email?.split('@')[0] || 'User';
                        const avatarURL = doc.data()?.avatarURL;
                        document.getElementById('sidebarUserName').innerText = name;
                        document.getElementById('sidebarUserEmail').innerText = user.email;
                        document.getElementById('sidebarAvatarInitials').innerText = name.charAt(0).toUpperCase();
                        if (avatarURL && sidebarAvatarImg) {
                            sidebarAvatarImg.src = avatarURL;
                            sidebarAvatarImg.style.display = 'block';
                            if (sidebarAvatarInitials) sidebarAvatarInitials.style.display = 'none';
                        } else if (sidebarAvatarInitials) {
                            sidebarAvatarInitials.style.display = 'inline';
                        }
                    });
                } catch(e){
                    console.error('Sidebar user bind error:', e);
                    setFallbackUser();
                }
            } else {
                setFallbackUser();
            }
        });
        return true;
    }

    if (!bindUserData()) {
        const retry = setInterval(() => {
            if (bindUserData()) clearInterval(retry);
        }, 500);
        setTimeout(() => clearInterval(retry), 10000);
    }
})();
</script>
