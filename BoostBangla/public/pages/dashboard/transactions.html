            --danger: #ef4444;

            --info: #3b82f6;

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {

            50% { transform: translateY(-5px); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }

            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-hover);
        }
        
        /* Stats Bar */
        .stats-bar {
            background: linear-gradient(135deg, #FF6B00, #CC5500);
            border-radius: 20px;
            padding: 20px 24px;
            color: white;

            flex-wrap: wrap;
            gap: 16px;

            align-items: center;
            gap: 12px;

            right: 24px;

        .toast.warning { border-left: 4px solid #f59e0b; }
        .toast.info { border-left: 4px solid #3b82f6; }
        
        /* Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #FF6B00;
            border-radius: 50%;

        /* Empty State */
        .empty-state {
            text-align: center;

        .empty-state i {
            font-size: 64px;
            color: #cbd5e1;

        }
        
        body.dark-mode .empty-state i {

        /* Amount Colors */
        .amount-positive {
            color: #10b981;

        }
        
        .amount-negative {
            color: #ef4444;
            font-weight: 700;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .stats-bar {
                flex-direction: column;
                text-align: center;

            .stat-item {
                justify-content: center;

                width: 100%;
            }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

            background: #f1f1f1;
            border-radius: 10px;

            background: #FF6B00;
            border-radius: 10px;
        }

            background: #CC5500;
        }

    <!-- Sidebar Component Loader -->
    <script>
(function loadSidebar(){
    const placeholder = document.getElementById('sidebar-placeholder');
    if(!placeholder) return;

    function injectSidebar(html){
        placeholder.innerHTML = html;
        placeholder.querySelectorAll('script').forEach((oldScript) => {
            const s = document.createElement('script');
            if (oldScript.src) s.src = oldScript.src;
            else s.textContent = oldScript.textContent;
            document.body.appendChild(s);
            oldScript.remove();
        });
    }

    fetch('/public/components/sidebar.html')
        .then(res => res.ok ? res.text() : Promise.reject())
        .then(injectSidebar)
        .catch(() => { console.warn('Sidebar fetch failed - using inline fallback'); });
})();
</script>

})();
</script>

            const icons = { orders:'📦', notifications:'🔔', search:'🔍', favorites:'⭐', transactions:'💳', tickets:'🎫', network:'🌐' };
            const titles = { orders:'No Orders Yet', notifications:'All Caught Up!', search:'No Results Found', favorites:'No Favorites', transactions:'No Transactions', tickets:'No Tickets', network:'Connection Error' };
            const messages = { orders:'Place your first order to get started', notifications:'You have no new notifications', search:'Try different keywords', favorites:'Click the star icon to save services', transactions:'Your transaction history will appear here', tickets:'Create a support ticket for help', network:'Check your internet connection' };
            const icon = icons[type] || '📭';
            const title = titles[type] || 'Nothing Here';

        };
        window.clearEmptyState = function(containerId){ const c=document.getElementById(containerId); if(c) c.innerHTML=''; };
        
        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <span>${message}</span>
                <i class="fas fa-times ml-3 cursor-pointer opacity-70 hover:opacity-100" onclick="this.parentElement.remove()"></i>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }
        
        // ============================================
        // FORMAT CURRENCY
        // ============================================
        function formatCurrencyBDT(amount) {
            if (amount === undefined || amount === null) return '৳0';
            return '৳' + Number(amount).toLocaleString('en-BD');
        }
        
        // ============================================
        // FORMAT DATE
        // ============================================
        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            if (timestamp.toDate) {
                const date = timestamp.toDate();
                return date.toLocaleString();
            }
            const date = timestamp instanceof Date ? timestamp : new Date(timestamp);
            return Number.isNaN(date.getTime()) ? 'N/A' : date.toLocaleString();
        }
        
        function formatShortDate(timestamp) {
            if (!timestamp) return 'N/A';
            if (timestamp.toDate) {
                const date = timestamp.toDate();
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            const date = timestamp instanceof Date ? timestamp : new Date(timestamp);
            return Number.isNaN(date.getTime()) ? 'N/A' : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        
        // ============================================
        // LOAD TRANSACTIONS
        // ============================================
        async function loadTransactions() {
            if (!currentUser) return;
            
            const container = document.getElementById('transactionsList');
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="spinner mx-auto mb-4"></div>
                    <p class="text-gray-500">Loading transactions...</p>
                </div>
            `;
            
            try {
                // Collect transactions from multiple sources
                const transactions = [];
                
                // Deposits
                const depositsSnapshot = await db.collection('deposits')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                depositsSnapshot.forEach(doc => {
                    const data = doc.data();
                    transactions.push({
                        id: doc.id,
                        type: 'deposit',
                        amount: data.amountBDT || 0,
                        status: data.status || 'pending',
                        description: `Deposit of ${formatCurrencyBDT(data.amountBDT)}`,
                        reference: data.transactionId || data.id,
                        method: data.method || 'bkash',
                        createdAt: data.createdAt,
                        data: data
                    });
                });
                
                // Orders
                const ordersSnapshot = await db.collection('orders')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                ordersSnapshot.forEach(doc => {
                    const data = doc.data();
                    transactions.push({
                        id: doc.id,
                        type: 'order',
                        amount: -(data.priceBDT || 0),
                        status: data.status || 'pending',
                        description: `Order: ${data.serviceName || 'Unknown Service'}`,
                        reference: data.id,
                        link: data.link,
                        quantity: data.quantity,
                        createdAt: data.createdAt,
                        data: data
                    });
                });
                
                // Affiliate earnings
                const affiliateSnapshot = await db.collection('affiliateEarnings')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                affiliateSnapshot.forEach(doc => {
                    const data = doc.data();
                    transactions.push({
                        id: doc.id,
                        type: 'affiliate',
                        amount: data.amount || 0,
                        status: 'completed',
                        description: `Affiliate commission from ${data.referredUser || 'referral'}`,
                        reference: data.orderId,
                        createdAt: data.createdAt,
                        data: data
                    });
                });
                
                // Withdrawals
                const withdrawalsSnapshot = await db.collection('withdrawals')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                withdrawalsSnapshot.forEach(doc => {
                    const data = doc.data();
                    transactions.push({
                        id: doc.id,
                        type: 'withdrawal',
                        amount: -(data.amount || 0),
                        status: data.status || 'pending',
                        description: `Withdrawal request of ${formatCurrencyBDT(data.amount)}`,
                        reference: data.account,
                        method: data.method,
                        createdAt: data.createdAt,
                        data: data
                    });
                });
                
                // Refunds
                const refundsSnapshot = await db.collection('refunds')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                refundsSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.status === 'completed') {
                        transactions.push({
                            id: doc.id,
                            type: 'refund',
                            amount: data.amount || 0,
                            status: 'completed',
                            description: `Refund for order ${data.orderId?.substring(0, 8)}`,
                            reference: data.orderId,
                            createdAt: data.createdAt,
                            data: data
                        });
                    }
                });

                try {
                    const mysqlResponse = await fetch(`/public/php/api-proxy.php?action=get_user_transactions&user_id=${encodeURIComponent(currentUser.uid)}&limit=100`);
                    const mysqlResult = await mysqlResponse.json();
                    (mysqlResult.transactions || []).forEach(tx => {
                        const signedAmount = ['debit', 'fee'].includes(tx.transaction_type)
                            ? -Math.abs(Number(tx.amount || 0))
                            : Math.abs(Number(tx.amount || 0));
                        transactions.push({
                            id: `mysql-${tx.id}`,
                            type: tx.transaction_type === 'credit' ? 'deposit' : tx.transaction_type,
                            amount: signedAmount,
                            status: 'completed',
                            description: tx.description || 'MySQL wallet transaction',
                            reference: tx.reference_id || tx.order_id,
                            createdAt: new Date(tx.created_at),
                            source: 'mysql',
                            data: tx
                        });
                    });
                } catch (mysqlError) {
                    console.warn('MySQL transactions unavailable:', mysqlError);
                }
                
                // Sort by date (newest first)
                transactions.sort((a, b) => {
                    const dateA = a.createdAt?.toDate?.() || (a.createdAt instanceof Date ? a.createdAt : new Date(a.createdAt || 0));
                    const dateB = b.createdAt?.toDate?.() || (b.createdAt instanceof Date ? b.createdAt : new Date(b.createdAt || 0));
                    return dateB - dateA;
                });
                
                allTransactions = transactions;
                updateStats();
                if(allTransactions.length === 0) showEmptyState('transactionsList', 'transactions', { actionUrl:'/public/pages/dashboard/add-funds.html', actionText:'Add Funds' });
                else { clearEmptyState('transactionsList'); renderTransactions(); }
                
            } catch (error) {
                console.error('Error loading transactions:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-3"></i>
                        <p class="text-gray-500">Failed to load transactions</p>
                        <button onclick="loadTransactions()" class="btn-primary mt-4">Try Again</button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // UPDATE STATS
        // ============================================
        function updateStats() {
            const totalDeposits = allTransactions
                .filter(t => t.type === 'deposit' && t.status === 'approved')
                .reduce((sum, t) => sum + Math.abs(t.amount), 0);
            
            const totalSpent = allTransactions
                .filter(t => t.type === 'order' && t.status === 'completed')
                .reduce((sum, t) => sum + Math.abs(t.amount), 0);
            
            const totalWithdrawn = allTransactions
                .filter(t => t.type === 'withdrawal' && t.status === 'completed')
                .reduce((sum, t) => sum + Math.abs(t.amount), 0);
            
            const totalAffiliate = allTransactions
                .filter(t => t.type === 'affiliate')
                .reduce((sum, t) => sum + Math.abs(t.amount), 0);
            
            const netBalance = totalDeposits + totalAffiliate - totalSpent - totalWithdrawn;
            
            document.getElementById('totalDeposits').innerHTML = formatCurrencyBDT(totalDeposits);
            document.getElementById('totalSpent').innerHTML = formatCurrencyBDT(totalSpent);
            document.getElementById('totalWithdrawn').innerHTML = formatCurrencyBDT(totalWithdrawn);
            document.getElementById('totalAffiliate').innerHTML = formatCurrencyBDT(totalAffiliate);
            document.getElementById('netBalance').innerHTML = formatCurrencyBDT(netBalance);
        }
        
        // ============================================
        // RENDER TRANSACTIONS
        // ============================================
        function renderTransactions() {
            let filtered = [...allTransactions];
            
            // Apply filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(t => t.type === currentFilter);
            }
            
            // Apply search
            if (currentSearch) {
                const searchLower = currentSearch.toLowerCase();
                filtered = filtered.filter(t => 
                    t.id.toLowerCase().includes(searchLower) ||
                    t.description.toLowerCase().includes(searchLower) ||
                    (t.reference && t.reference.toLowerCase().includes(searchLower))
                );
            }
            
            // Apply date range
            if (currentDateRange !== 'all') {
                const now = new Date();
                let startDate = new Date();
                
                switch(currentDateRange) {
                    case 'today':
                        startDate.setHours(0, 0, 0, 0);
                        break;
                    case 'week':
                        startDate.setDate(now.getDate() - 7);
                        break;
                    case 'month':
                        startDate.setMonth(now.getMonth() - 1);
                        break;
                    case 'year':
                        startDate.setFullYear(now.getFullYear() - 1);
                        break;
                }
                
                filtered = filtered.filter(t => {
                    const date = t.createdAt?.toDate?.() || new Date(0);
                    return date >= startDate;
                });
            }
            
            // Pagination
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(start, start + itemsPerPage);
            
            const container = document.getElementById('transactionsList');
            
            if (paginated.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3 class="text-lg font-semibold mb-2">No transactions found</h3>
                        <p class="text-gray-500">${currentSearch ? 'Try a different search term' : 'Your transaction history will appear here'}</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            container.innerHTML = paginated.map(transaction => {
                const typeClass = getTypeClass(transaction.type);
                const typeIcon = getTypeIcon(transaction.type);
                const typeText = getTypeText(transaction.type);
                const amountClass = transaction.amount >= 0 ? 'amount-positive' : 'amount-negative';
                const amountPrefix = transaction.amount >= 0 ? '+' : '';
                const statusClass = getStatusClass(transaction.status);
                const statusIcon = getStatusIcon(transaction.status);
                
                return `
                    <div class="transaction-card" onclick="viewTransactionDetails('${transaction.id}', '${transaction.type}')">
                        <div class="flex flex-wrap justify-between items-start gap-3">
                            <div class="flex items-center gap-3 flex-1">
                                <div class="w-10 h-10 ${typeClass.replace('type-', 'bg-')}/10 rounded-full flex items-center justify-center">
                                    <i class="${typeIcon} text-lg"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="type-badge ${typeClass}">
                                            <i class="${typeIcon} mr-1"></i> ${typeText}
                                        </span>
                                        <span class="status-badge ${statusClass}">
                                            <i class="${statusIcon}"></i> ${getStatusText(transaction.status)}
                                        </span>
                                    </div>
                                    <p class="text-sm mt-1">${escapeHtml(transaction.description)}</p>
                                    <div class="flex gap-3 mt-1 text-xs text-gray-500">
                                        <span><i class="fas fa-hashtag"></i> ${transaction.id.substring(0, 8)}</span>
                                        <span><i class="far fa-calendar-alt"></i> ${formatShortDate(transaction.createdAt)}</span>
                                        ${transaction.reference ? `<span><i class="fas fa-tag"></i> ${transaction.reference.substring(0, 12)}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xl font-bold ${amountClass}">${amountPrefix}${formatCurrencyBDT(Math.abs(transaction.amount))}</div>
                                <i class="fas fa-chevron-right text-gray-400 mt-2"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            renderPagination(totalPages);
        }
        
        function getTypeClass(type) {
            switch(type) {
                case 'deposit': return 'type-deposit';
                case 'order': return 'type-order';
                case 'withdrawal': return 'type-withdrawal';
                case 'affiliate': return 'type-affiliate';
                case 'refund': return 'type-refund';
                default: return 'type-deposit';
            }
        }
        
        function getTypeIcon(type) {
            switch(type) {
                case 'deposit': return 'fas fa-arrow-down';
                case 'order': return 'fas fa-shopping-cart';
                case 'withdrawal': return 'fas fa-arrow-up';
                case 'affiliate': return 'fas fa-users';
                case 'refund': return 'fas fa-undo-alt';
                default: return 'fas fa-circle';
            }
        }
        
        function getTypeText(type) {
            switch(type) {
                case 'deposit': return 'Deposit';
                case 'order': return 'Order';
                case 'withdrawal': return 'Withdrawal';
                case 'affiliate': return 'Affiliate';
                case 'refund': return 'Refund';
                default: return type;
            }
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'completed': return 'status-success';
                case 'approved': return 'status-success';
                case 'pending': return 'status-pending';
                case 'failed': return 'status-failed';
                case 'rejected': return 'status-failed';
                default: return 'status-pending';
            }
        }
        
        function getStatusIcon(status) {
            switch(status) {
                case 'completed': return 'fas fa-check-circle';
                case 'approved': return 'fas fa-check-circle';
                case 'pending': return 'fas fa-clock';
                case 'failed': return 'fas fa-times-circle';
                case 'rejected': return 'fas fa-times-circle';
                default: return 'fas fa-question-circle';
            }
        }
        
        function getStatusText(status) {
            switch(status) {
                case 'completed': return 'Completed';
                case 'approved': return 'Approved';
                case 'pending': return 'Pending';
                case 'failed': return 'Failed';
                case 'rejected': return 'Rejected';
                default: return status || 'Pending';
            }
        }
        
        // ============================================
        // RENDER PAGINATION
        // ============================================
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = `
                <button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
            `;
            
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            if (startPage > 1) {
                html += `<button class="pagination-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) html += `<span class="px-2">...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${currentPage === i ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="px-2">...</span>`;
                html += `<button class="pagination-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }
            
            html += `
                <button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            `;
            
            container.innerHTML = html;
        }
        
        window.changePage = function(page) {
            currentPage = page;
            renderTransactions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

            document.body.style.overflow = 'auto';

        // ============================================
        // EXPORT TRANSACTIONS
        // ============================================
        document.getElementById('exportTransactionsBtn')?.addEventListener('click', () => {
            let filtered = [...allTransactions];
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(t => t.type === currentFilter);
            }
            
            if (currentSearch) {
                const searchLower = currentSearch.toLowerCase();
                filtered = filtered.filter(t => 
                    t.id.toLowerCase().includes(searchLower) ||
                    t.description.toLowerCase().includes(searchLower)
                );
            }
            
            if (filtered.length === 0) {
                showToast('No transactions to export', 'warning');
                return;
            }
            
            const headers = ['ID', 'Type', 'Amount (BDT)', 'Status', 'Description', 'Reference', 'Date'];
            const rows = filtered.map(t => [
                t.id,
                getTypeText(t.type),
                t.amount,
                getStatusText(t.status),
                t.description,
                t.reference || '',
                formatDate(t.createdAt)
            ]);
            
            const csvContent = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `boostbangla-transactions-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast(`Exported ${filtered.length} transactions`, 'success');
        });

        document.getElementById('refreshTransactionsBtn')?.addEventListener('click', async () => {

            await loadTransactions();
            btn.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> Refresh';
            showToast('Transactions refreshed!', 'success');

            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // EVENT LISTENERS

        document.getElementById('searchTransactions')?.addEventListener('input', (e) => {

                currentPage = 1;

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                renderTransactions();
            });
        });
        
        // ============================================
        // AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/public/pages/public/login.html';
                return;
            }
            
            currentUser = user;
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().isAdmin === true) {
                window.location.href = '/admin/index.html';
                return;
            }
            
            await loadTransactions();
        });
        // ============================================
        // DARK MODE
        // ============================================
        const darkModeToggle = document.getElementById('darkModeToggle');
        if (darkModeToggle) {
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });
        }
        
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
        
        console.log('✅ Transactions page loaded');
    </script>

<script>
// Global logout fix - ensures logout works everywhere
(function fixLogout(){
    const checkInterval = setInterval(() => {
        const logoutBtn = document.getElementById('logoutBtn') || document.getElementById('sidebarLogoutBtn');
        if(logoutBtn && typeof firebase !== 'undefined' && firebase.auth){
            clearInterval(checkInterval);
            logoutBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                firebase.auth().signOut()
                    .then(() => { window.location.href = '/public/pages/public/login.html'; })
                    .catch(err => { console.error('Logout error:', err); alert('Logout failed. Please try again.'); });
            };
        }
    }, 500);
})();
</script>
