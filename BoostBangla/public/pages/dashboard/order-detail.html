        :root {

            --danger: #ef4444;

            --card-shadow-hover: 0 25px 30px -12px rgba(255, 107, 0, 0.15);

        * {

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;

        .mobile-menu-btn:active {

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);

            to {

            }

            from {

            to {

                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }

            to { transform: rotate(360deg); }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .animate-slide-up {

    <script>
(function loadSidebar(){
    const placeholder = document.getElementById('sidebar-placeholder');
    if(!placeholder) return;

    function injectSidebar(html){
        placeholder.innerHTML = html;
        placeholder.querySelectorAll('script').forEach((oldScript) => {
            const s = document.createElement('script');
            if (oldScript.src) s.src = oldScript.src;
            else s.textContent = oldScript.textContent;
            document.body.appendChild(s);
            oldScript.remove();
        });
    }

    fetch('/public/components/sidebar.html')
        .then(res => res.ok ? res.text() : Promise.reject())
        .then(injectSidebar)
        .catch(() => { console.warn('Sidebar fetch failed - using inline fallback'); });
})();
</script>

    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDypaa-pHjEc4rrXHrtj8i_8vgo_5XMY9g",
            authDomain: "boostbangla-629a1.firebaseapp.com",
            projectId: "boostbangla-629a1",
            storageBucket: "boostbangla-629a1.firebasestorage.app",
            messagingSenderId: "384867462668",
            appId: "1:384867462668:web:bbc79c6a7ead66b439c829"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let currentOrder = null;
        let currentOrderId = null;
        
        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <span>${message}</span>
                <i class="fas fa-times ml-3 cursor-pointer opacity-70 hover:opacity-100" onclick="this.parentElement.remove()"></i>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }
        
        // ============================================
        // FORMAT CURRENCY
        // ============================================
        function formatCurrencyBDT(amount) {
            if (amount === undefined || amount === null) return '৳0';
            return '৳' + Number(amount).toLocaleString('en-BD');
        }
        
        // ============================================
        // FORMAT DATE
        // ============================================
        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            if (timestamp.toDate) {
                return timestamp.toDate().toLocaleString();
            }
            const date = timestamp instanceof Date ? timestamp : new Date(timestamp);
            return Number.isNaN(date.getTime()) ? 'N/A' : date.toLocaleString();
        }
        
        // ============================================
        // GET ORDER ID FROM URL
        // ============================================
        function getOrderIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }
        
        // ============================================
        // LOAD ORDER DETAILS
        // ============================================
        async function loadOrderDetails() {
            const orderId = getOrderIdFromUrl();
            if (!orderId) {
                document.getElementById('orderContent').innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-3"></i>
                        <p class="text-gray-500">No order ID specified</p>
                        <a href="/public/pages/dashboard/orders.html" class="btn-primary mt-4 inline-block">View Orders</a>
                    </div>
                `;
                return;
            }
            
            currentOrderId = orderId;
            
            try {
                const orderDoc = await db.collection('orders').doc(orderId).get();
                
                if (!orderDoc.exists) {
                    document.getElementById('orderContent').innerHTML = `
                        <div class="text-center py-12">
                            <i class="fas fa-search text-4xl text-red-400 mb-3"></i>
                            <p class="text-gray-500">Order not found</p>
                            <a href="/public/pages/dashboard/orders.html" class="btn-primary mt-4 inline-block">View Orders</a>
                        </div>
                    `;
                    return;
                }
                
                currentOrder = { id: orderDoc.id, ...orderDoc.data() };
                
                // Verify order belongs to current user
                if (currentOrder.userId !== currentUser.uid) {
                    document.getElementById('orderContent').innerHTML = `
                        <div class="text-center py-12">
                            <i class="fas fa-lock text-4xl text-red-400 mb-3"></i>
                            <p class="text-gray-500">You don't have permission to view this order</p>
                            <a href="/public/pages/dashboard/orders.html" class="btn-primary mt-4 inline-block">View Orders</a>
                        </div>
                    `;
                    return;
                }
                
                renderOrderDetails();
                
            } catch (error) {
                console.error('Error loading order:', error);
                document.getElementById('orderContent').innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-3"></i>
                        <p class="text-gray-500">Failed to load order details</p>
                        <button onclick="loadOrderDetails()" class="btn-primary mt-4">Try Again</button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // RENDER ORDER DETAILS
        // ============================================
        function renderOrderDetails() {
            const order = currentOrder;
            const statusClass = getStatusClass(order.status);
            const statusText = getStatusText(order.status);
            const statusIcon = getStatusIcon(order.status);
            
            const container = document.getElementById('orderContent');
            
            container.innerHTML = `
                <div class="animate-slide-up">
                    <!-- Header Card -->
                    <div class="glass-card p-6 mb-6">
                        <div class="flex flex-wrap justify-between items-start gap-4">
                            <div>
                                <h1 class="text-2xl font-bold mb-2">Order Details</h1>
                                <p class="text-gray-500 dark:text-gray-400 text-sm">Order ID: <span class="font-mono">#${order.id}</span></p>
                            </div>
                            <div class="status-badge ${statusClass}">
                                <i class="fas ${statusIcon}"></i> ${statusText}
                            </div>
                        </div>
                    </div>
                    
                    <!-- Order Information Card -->
                    <div class="info-card mb-6 animate-slide-up" style="animation-delay: 0.1s">
                        <div class="flex items-center gap-3 mb-4 pb-3 border-b border-gray-200 dark:border-gray-700">
                            <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center">
                                <i class="fas fa-info-circle text-primary text-lg"></i>
                            </div>
                            <h2 class="text-xl font-bold">Order Information</h2>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Service Name</div>
                            <div class="info-value">${escapeHtml(order.serviceName || 'N/A')}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Service ID</div>
                            <div class="info-value">${order.serviceId || 'N/A'}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Link / Username</div>
                            <div class="info-value">
                                <a href="${order.link}" target="_blank" class="text-primary hover:underline break-all">${escapeHtml(order.link || 'N/A')}</a>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Quantity</div>
                            <div class="info-value">${(order.quantity || 0).toLocaleString()}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Amount (USD)</div>
                            <div class="info-value">$${(order.priceUSD || 0).toFixed(2)}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Amount (BDT)</div>
                            <div class="info-value font-bold text-primary text-lg">${formatCurrencyBDT(order.priceBDT)}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Order Date</div>
                            <div class="info-value">${formatDate(order.createdAt)}</div>
                        </div>
                        ${order.completedAt ? `
                            <div class="info-row">
                                <div class="info-label">Completed Date</div>
                                <div class="info-value">${formatDate(order.completedAt)}</div>
                            </div>
                        ` : ''}
                        ${order.apiOrderId ? `
                            <div class="info-row">
                                <div class="info-label">API Order ID</div>
                                <div class="info-value font-mono text-sm">${order.apiOrderId}</div>
                            </div>
                        ` : ''}
                    </div>
                    
                    <!-- Order Status Timeline -->
                    <div class="info-card mb-6 animate-slide-up" style="animation-delay: 0.15s">
                        <div class="flex items-center gap-3 mb-4 pb-3 border-b border-gray-200 dark:border-gray-700">
                            <div class="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center">
                                <i class="fas fa-chart-line text-blue-500 text-lg"></i>
                            </div>
                            <h2 class="text-xl font-bold">Order Timeline</h2>
                        </div>
                        <div class="timeline-container">
                            ${renderTimeline()}
                        </div>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="info-card animate-slide-up" style="animation-delay: 0.2s">
                        <div class="flex items-center gap-3 mb-4 pb-3 border-b border-gray-200 dark:border-gray-700">
                            <div class="w-10 h-10 bg-green-500/10 rounded-xl flex items-center justify-center">
                                <i class="fas fa-bolt text-green-500 text-lg"></i>
                            </div>
                            <h2 class="text-xl font-bold">Actions</h2>
                        </div>
                        <div class="action-buttons flex flex-wrap gap-3">
                            <a href="/public/pages/dashboard/new-order.html?serviceId=${order.serviceId}" class="btn-primary">
                                <i class="fas fa-cart-plus mr-2"></i> Order Again
                            </a>
                            ${order.status === 'pending' ? `
                                <button id="cancelOrderBtn" class="btn-danger">
                                    <i class="fas fa-times-circle mr-2"></i> Cancel Order
                                </button>
                            ` : ''}
                            ${order.status === 'completed' ? `
                                <button id="requestRefillBtn" class="btn-outline">
                                    <i class="fas fa-sync-alt mr-2"></i> Request Refill
                                </button>
                            ` : ''}
                            <button id="downloadInvoiceBtn" class="btn-outline">
                                <i class="fas fa-download mr-2"></i> Download Invoice
                            </button>
                            <button id="contactSupportBtn" class="btn-outline">
                                <i class="fas fa-headset mr-2"></i> Contact Support
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Attach event listeners
            document.getElementById('cancelOrderBtn')?.addEventListener('click', () => openCancelModal());
            document.getElementById('requestRefillBtn')?.addEventListener('click', () => openRefillModal());
            document.getElementById('downloadInvoiceBtn')?.addEventListener('click', downloadInvoice);
            document.getElementById('contactSupportBtn')?.addEventListener('click', () => {
                window.location.href = '/public/pages/dashboard/tickets.html';
            });
        }
        
        // ============================================
        // RENDER TIMELINE
        // ============================================
        function renderTimeline() {
            const order = currentOrder;
            const status = order.status;
            
            const timelineSteps = [
                { key: 'pending', title: 'Order Placed', icon: 'fa-shopping-cart', description: 'Your order has been received' },
                { key: 'processing', title: 'Processing', icon: 'fa-spinner', description: 'Your order is being processed' },
                { key: 'completed', title: 'Completed', icon: 'fa-check-circle', description: 'Your order has been completed' }
            ];
            
            let currentStep = 0;
            if (status === 'pending') currentStep = 0;
            else if (status === 'processing') currentStep = 1;
            else if (status === 'completed' || status === 'partial') currentStep = 2;
            else if (status === 'cancelled') currentStep = -1;
            
            if (status === 'cancelled') {
                return `
                    <div class="timeline-item">
                        <div class="timeline-dot completed"></div>
                        <div class="timeline-line"></div>
                        <div class="timeline-content">
                            <div class="timeline-title">Order Cancelled</div>
                            <div class="timeline-date">${formatDate(order.cancelledAt || order.updatedAt)}</div>
                            <p class="text-sm text-red-500 mt-1">This order has been cancelled.</p>
                        </div>
                    </div>
                `;
            }
            
            return timelineSteps.map((step, index) => {
                let dotClass = 'timeline-dot';
                let isCompleted = index <= currentStep;
                let isCurrent = index === currentStep && status !== 'completed';
                
                if (isCompleted) dotClass += ' completed';
                if (isCurrent) dotClass += ' current';
                
                let date = '';
                if (index === 0 && order.createdAt) date = formatDate(order.createdAt);
                if (index === 1 && order.processingAt) date = formatDate(order.processingAt);
                if (index === 2 && order.completedAt) date = formatDate(order.completedAt);
                
                let progressPercent = 0;
                if (status === 'processing') progressPercent = 50;
                else if (status === 'completed') progressPercent = 100;
                else if (status === 'pending') progressPercent = 10;
                
                return `
                    <div class="timeline-item">
                        <div class="${dotClass}"></div>
                        ${index < timelineSteps.length - 1 ? '<div class="timeline-line"></div>' : ''}
                        <div class="timeline-content">
                            <div class="timeline-title">${step.title}</div>
                            <div class="timeline-date">${date || 'Pending'}</div>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${step.description}</p>
                            ${isCurrent && status === 'processing' ? `
                                <div class="progress-container mt-2">
                                    <div class="progress-bar" style="width: ${progressPercent}%"></div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ============================================
        // GET STATUS STYLES
        // ============================================
        function getStatusClass(status) {
            switch(status) {
                case 'pending': return 'status-pending';
                case 'processing': return 'status-processing';
                case 'completed': return 'status-completed';
                case 'partial': return 'status-partial';
                case 'cancelled': return 'status-cancelled';
                case 'refunded': return 'status-refunded';
                default: return 'status-pending';
            }
        }
        
        function getStatusText(status) {
            switch(status) {
                case 'pending': return 'Pending';
                case 'processing': return 'Processing';
                case 'completed': return 'Completed';
                case 'partial': return 'Partial';
                case 'cancelled': return 'Cancelled';
                case 'refunded': return 'Refunded';
                default: return status || 'Pending';
            }
        }
        
        function getStatusIcon(status) {
            switch(status) {
                case 'pending': return 'fa-clock';
                case 'processing': return 'fa-spinner fa-spin';
                case 'completed': return 'fa-check-circle';
                case 'partial': return 'fa-chart-line';
                case 'cancelled': return 'fa-times-circle';
                case 'refunded': return 'fa-undo-alt';
                default: return 'fa-question-circle';
            }
        }
        
        // ============================================
        // CANCEL ORDER
        // ============================================
        window.openCancelModal = function() {
            document.getElementById('cancelMessage').innerHTML = `Are you sure you want to cancel order <span class="font-mono">#${currentOrder.id.substring(0, 8)}</span>? This will refund the amount to your balance.`;
            document.getElementById('cancelModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeCancelModal = function() {
            document.getElementById('cancelModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
        
        document.getElementById('confirmCancelBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('confirmCancelBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0 auto;"></div>';
            
            try {
                const mysqlOrderId = currentOrder.mysqlId || currentOrder.localOrderId || currentOrder.local_order_id || currentOrder.id;
                const response = await fetch('/public/php/api-proxy.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
                    body: new URLSearchParams({ action: 'cancel_order', order_id: mysqlOrderId })
                });
                const result = await response.json();
                if (!response.ok || result.success === false) throw new Error(result.error || 'Failed to cancel order');

                await db.runTransaction(async (transaction) => {
                    const userRef = db.collection('users').doc(currentUser.uid);
                    const userSnap = await transaction.get(userRef);
                    const currentBalance = Number(userSnap.data()?.balance || 0);
                    transaction.update(userRef, {
                        balance: currentBalance + Number(currentOrder.priceBDT || 0),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    transaction.update(db.collection('orders').doc(currentOrderId), {
                        status: 'cancelled',
                        cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                
                // Create notification
                await db.collection('notifications').add({
                    userId: currentUser.uid,
                    title: 'Order Cancelled',
                    message: `Order #${currentOrder.id.substring(0, 8)} has been cancelled. ${formatCurrencyBDT(currentOrder.priceBDT)} has been refunded to your balance.`,
                    type: 'order',
                    read: false,
                    createdAt: new Date()
                });
                
                showToast('Order cancelled and refunded successfully!', 'success');
                closeCancelModal();
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
                
            } catch (error) {
                console.error('Error cancelling order:', error);
                showToast('Failed to cancel order', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
        
        // ============================================
        // REQUEST REFILL
        // ============================================
        window.openRefillModal = function() {
            document.getElementById('refillMessage').innerHTML = `Are you sure you want to request a refill for order <span class="font-mono">#${currentOrder.id.substring(0, 8)}</span>?`;
            document.getElementById('refillModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeRefillModal = function() {
            document.getElementById('refillModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
        
        document.getElementById('confirmRefillBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('confirmRefillBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0 auto;"></div>';
            
            try {
                // Create refill request
                await db.collection('refills').add({
                    orderId: currentOrderId,
                    userId: currentUser.uid,
                    status: 'pending',
                    requestedAt: new Date()
                });
                
                // Create admin notification
                await db.collection('adminNotifications').add({
                    type: 'refill_request',
                    orderId: currentOrderId,
                    userId: currentUser.uid,
                    message: `Refill requested for order #${currentOrder.id.substring(0, 8)}`,
                    read: false,
                    createdAt: new Date()
                });
                
                showToast('Refill request submitted successfully!', 'success');
                closeRefillModal();
                
            } catch (error) {
                console.error('Error requesting refill:', error);
                showToast('Failed to submit refill request', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
        
        // ============================================
        // DOWNLOAD INVOICE
        // ============================================
        function downloadInvoice() {
            const order = currentOrder;
            const invoiceData = {
                invoiceId: `INV-${order.id.substring(0, 8)}`,
                date: new Date().toISOString(),
                orderId: order.id,
                service: order.serviceName,
                link: order.link,
                quantity: order.quantity,
                amountUSD: order.priceUSD,
                amountBDT: order.priceBDT,
                status: order.status,
                createdAt: order.createdAt?.toDate?.() || new Date()
            };
            
            const invoiceHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Invoice ${invoiceData.invoiceId}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
                        .header { text-align: center; margin-bottom: 30px; }
                        .logo { color: #FF6B00; font-size: 24px; font-weight: bold; }
                        .invoice-title { font-size: 28px; margin: 20px 0; }
                        .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid #eee; }
                        .info-label { width: 150px; font-weight: bold; }
                        .total { font-size: 20px; font-weight: bold; color: #FF6B00; margin-top: 20px; }
                        .footer { text-align: center; margin-top: 40px; color: #666; font-size: 12px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="logo">BoostBangla</div>
                        <div class="invoice-title">INVOICE</div>
                    </div>
                    <div class="info-row"><div class="info-label">Invoice ID:</div><div>${invoiceData.invoiceId}</div></div>
                    <div class="info-row"><div class="info-label">Date:</div><div>${invoiceData.date}</div></div>
                    <div class="info-row"><div class="info-label">Order ID:</div><div>${invoiceData.orderId}</div></div>
                    <div class="info-row"><div class="info-label">Service:</div><div>${invoiceData.service}</div></div>
                    <div class="info-row"><div class="info-label">Link:</div><div>${invoiceData.link}</div></div>
                    <div class="info-row"><div class="info-label">Quantity:</div><div>${invoiceData.quantity.toLocaleString()}</div></div>
                    <div class="info-row"><div class="info-label">Amount (USD):</div><div>$${invoiceData.amountUSD}</div></div>
                    <div class="info-row"><div class="info-label">Amount (BDT):</div><div>৳${invoiceData.amountBDT.toLocaleString()}</div></div>
                    <div class="info-row"><div class="info-label">Status:</div><div>${invoiceData.status}</div></div>
                    <div class="total">Total: ৳${invoiceData.amountBDT.toLocaleString()}</div>
                    <div class="footer">Thank you for choosing BoostBangla!</div>
                </body>
                </html>
            `;
            
            const blob = new Blob([invoiceHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `invoice-${invoiceData.invoiceId}.html`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Invoice downloaded!', 'success');
        }
        
        // ============================================
        // ESCAPE HTML
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================
        // AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/public/pages/public/login.html';
                return;
            }
            
            currentUser = user;
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().isAdmin === true) {
                window.location.href = '/admin/index.html';
                return;
            }
            
            await loadOrderDetails();
            
            // Setup realtime listener for order updates
            const orderId = getOrderIdFromUrl();
            if (orderId) {
                db.collection('orders').doc(orderId)
                    .onSnapshot((doc) => {
                        if (doc.exists && doc.data().userId === currentUser.uid) {
                            currentOrder = { id: doc.id, ...doc.data() };
                            renderOrderDetails();
                        }
                    });
            }
        });
        // ============================================
        // DARK MODE
        // ============================================
        const darkModeToggle = document.getElementById('darkModeToggle');
        if (darkModeToggle) {
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });
        }
        
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
        
        console.log('✅ Order Detail page loaded');
    </script>
    
    <!-- Universal Notifications Helper -->
    <script src="/public/assets/js/core/notifications-helper.js"></script>
</body>
