<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Notifications | BoostBangla - Stay Updated</title>
    <meta name="description" content="View all your BoostBangla notifications. Stay updated with order status, payment confirmations, ticket replies, and promotional offers.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if(typeof showToast !== 'function') window.showToast = (msg,type)=>{alert(msg)};

        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#FF6B00', primaryDark: '#CC5500', darkBg: '#02101A' },
                    fontFamily: { inter: ['Inter', 'sans-serif'], bangla: ['Noto Sans Bengali', 'Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-subtle': 'bounceSubtle 1s ease-in-out infinite',
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Modern CSS Variables */
        :root {
            --primary: #FF6B00;
            --primary-dark: #CC5500;
            --primary-light: #FF8C42;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark-bg: #02101A;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --card-shadow-hover: 0 25px 30px -12px rgba(255, 107, 0, 0.15);
        }
        
        * {
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 60;
            background: linear-gradient(135deg, #FF6B00, #CC5500);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 107, 0, 0.3);
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }
        
        .mobile-menu-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 28px rgba(255, 107, 0, 0.4);
        }
        
        .mobile-menu-btn:active {
            transform: scale(0.95);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes bounceSubtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }
        
        .animate-slide-down {
            animation: slideDown 0.4s ease-out forwards;
        }
        
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body.dark-mode .glass-card {
            background: rgba(30, 41, 59, 0.95);
        }
        
        /* Stats Bar */
        .stats-bar {
            background: linear-gradient(135deg, #FF6B00, #CC5500);
            border-radius: 20px;
            padding: 20px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* Notification Cards */
        .notification-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e5e7eb;
            cursor: pointer;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }
        
        body.dark-mode .notification-card {
            background: #1e293b;
            border-color: #334155;
        }
        
        .notification-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.03), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .notification-card:hover::after {
            opacity: 1;
        }
        
        .notification-card:hover {
            transform: translateX(5px);
            border-color: #FF6B00;
            box-shadow: 0 10px 25px -5px rgba(255, 107, 0, 0.15);
        }
        
        .notification-card.unread {
            background: linear-gradient(135deg, #fff8f0, white);
            border-left: 4px solid #FF6B00;
        }
        
        body.dark-mode .notification-card.unread {
            background: linear-gradient(135deg, #2d1a0f, #1e293b);
        }
        
        .notification-card.read {
            opacity: 0.85;
        }
        
        /* Notification Icons */
        .notif-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .icon-order { background: #d1fae5; color: #059669; }
        .icon-payment { background: #dbeafe; color: #2563eb; }
        .icon-ticket { background: #fef3c7; color: #d97706; }
        .icon-promo { background: #fce7f3; color: #db2777; }
        .icon-system { background: #e0e7ff; color: #4f46e5; }
        
        body.dark-mode .icon-order { background: #064e3b; color: #34d399; }
        body.dark-mode .icon-payment { background: #1e3a5f; color: #60a5fa; }
        body.dark-mode .icon-ticket { background: #451a03; color: #fbbf24; }
        body.dark-mode .icon-promo { background: #831843; color: #f472b6; }
        body.dark-mode .icon-system { background: #1e3a5f; color: #818cf8; }
        
        /* Filter Buttons */
        .filter-btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border: 2px solid #e5e7eb;
            color: #6b7280;
            white-space: nowrap;
        }
        
        body.dark-mode .filter-btn {
            background: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }
        
        .filter-btn:hover {
            transform: translateY(-2px);
            border-color: #FF6B00;
            color: #FF6B00;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #FF6B00, #CC5500);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #FF6B00, #CC5500);
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(255, 107, 0, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(1px);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #e5e7eb;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        body.dark-mode .btn-outline {
            border-color: #334155;
            color: #e2e8f0;
        }
        
        .btn-outline:hover {
            border-color: #FF6B00;
            color: #FF6B00;
            transform: translateY(-2px);
        }
        
        /* Action Buttons */
        .action-btn {
            background: transparent;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        body.dark-mode .action-btn {
            border-color: #334155;
            color: #94a3b8;
        }
        
        .action-btn:hover {
            border-color: #FF6B00;
            color: #FF6B00;
            transform: scale(1.05);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 28px;
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body.dark-mode .modal-content {
            background: #1e293b;
        }
        
        /* Pagination */
        .pagination-btn {
            padding: 10px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        body.dark-mode .pagination-btn {
            background: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }
        
        .pagination-btn:hover:not(:disabled) {
            border-color: #FF6B00;
            color: #FF6B00;
            transform: translateY(-2px);
        }
        
        .pagination-btn.active {
            background: linear-gradient(135deg, #FF6B00, #CC5500);
            color: white;
            border-color: transparent;
        }
        
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            padding: 14px 24px;
            border-radius: 60px;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            font-weight: 500;
        }
        
        body.dark-mode .toast {
            background: #1e293b;
            color: white;
        }
        
        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.warning { border-left: 4px solid #f59e0b; }
        .toast.info { border-left: 4px solid #3b82f6; }
        
        /* Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #FF6B00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state i {
            font-size: 64px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        
        body.dark-mode .empty-state i {
            color: #475569;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #FF6B00;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #CC5500;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .stats-bar {
                flex-direction: column;
                text-align: center;
            }
            .stat-item {
                justify-content: center;
            }
            .filter-buttons {
                overflow-x: auto;
                padding-bottom: 8px;
            }
            .notification-card {
                padding: 16px;
            }
            .notif-icon {
                width: 40px;
                height: 40px;
            }
        }
        
        /* Sound Toggle */
        .sound-toggle {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        
        .sound-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .sound-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e5e7eb;
            transition: 0.3s;
            border-radius: 24px;
        }
        
        .sound-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        input:checked + .sound-slider {
            background: linear-gradient(135deg, #FF6B00, #CC5500);
        }
        
        input:checked + .sound-slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>
    <div id="header-placeholder"></div>
    <!-- Sidebar Component Loader -->
    <script>
(function loadSidebar(){
    const placeholder = document.getElementById('sidebar-placeholder');
    if(!placeholder) return;

    function injectSidebar(html){
        placeholder.innerHTML = html;
        placeholder.querySelectorAll('script').forEach((oldScript) => {
            const s = document.createElement('script');
            if (oldScript.src) s.src = oldScript.src;
            else s.textContent = oldScript.textContent;
            document.body.appendChild(s);
            oldScript.remove();
        });
    }

    fetch('/public/components/sidebar.html')
        .then(res => res.ok ? res.text() : Promise.reject())
        .then(injectSidebar)
        .catch(() => { console.warn('Sidebar fetch failed - using inline fallback'); });
})();
</script>
    <!-- Universal Header Component Loader -->
    <script>
(function loadHeader(){
    const placeholder = document.getElementById('header-placeholder');
    if(!placeholder) return;

    function injectHeader(html){
        placeholder.innerHTML = html;
        placeholder.querySelectorAll('script').forEach((oldScript) => {
            const s = document.createElement('script');
            if (oldScript.src) s.src = oldScript.src;
            else s.textContent = oldScript.textContent;
            document.body.appendChild(s);
            oldScript.remove();
        });
    }

    fetch('/public/components/universal-header.html')
        .then(res => res.ok ? res.text() : Promise.reject())
        .then(injectHeader)
        .catch(() => { console.warn('Header fetch failed - using inline fallback'); });
})();
</script>

            <p class="text-gray-500 dark:text-gray-400 mb-4">This action cannot be undone. All notifications will be permanently deleted.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 btn-outline">Cancel</button>
                <button id="confirmDeleteBtn" class="flex-1 btn-danger">Yes, Delete All</button>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toastContainer"></div>
    
    <!-- Audio Elements -->
    <audio id="notificationSound" preload="none"></audio>
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/public/assets/js/core/config.js"></script>
    <script src="/public/assets/js/core/auth.js"></script>
  <script src="/public/assets/js/core/balance-manager.js"></script>
    <script src="/public/assets/js/core/utils.js"></script>
    <script src="/public/assets/js/dark-mode.js"></script>
    
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDypaa-pHjEc4rrXHrtj8i_8vgo_5XMY9g",
            authDomain: "boostbangla-629a1.firebaseapp.com",
            projectId: "boostbangla-629a1",
            storageBucket: "boostbangla-629a1.firebasestorage.app",
            messagingSenderId: "384867462668",
            appId: "1:384867462668:web:bbc79c6a7ead66b439c829"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let allNotifications = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let currentPage = 1;
        let itemsPerPage = 20;
        let soundEnabled = false;
        let notificationAudio = null;
        
        window.showEmptyState = function(containerId, type, options = {}){
            const container = document.getElementById(containerId);
            if(!container) return;
            const icons = { orders:'📦', notifications:'🔔', search:'🔍', favorites:'⭐', transactions:'💳', tickets:'🎫', network:'🌐' };
            const titles = { orders:'No Orders Yet', notifications:'All Caught Up!', search:'No Results Found', favorites:'No Favorites', transactions:'No Transactions', tickets:'No Tickets', network:'Connection Error' };
            const messages = { orders:'Place your first order to get started', notifications:'You have no new notifications', search:'Try different keywords', favorites:'Click the star icon to save services', transactions:'Your transaction history will appear here', tickets:'Create a support ticket for help', network:'Check your internet connection' };
            const icon = icons[type] || '📭';
            const title = titles[type] || 'Nothing Here';
            const message = options.message || messages[type] || 'Content will appear soon';
            container.innerHTML = `<div class="empty-state text-center py-12"><div class="text-6xl mb-4">${icon}</div><h3 class="text-xl font-bold mb-2">${title}</h3><p class="text-gray-500 mb-4">${message}</p>${options.actionUrl ? `<a href="${options.actionUrl}" class="btn-primary">${options.actionText || 'Get Started'} →</a>` : ''}</div>`;
        };
        window.clearEmptyState = function(containerId){ const c=document.getElementById(containerId); if(c) c.innerHTML=''; };
        
        // ============================================
        // INITIALIZE AUDIO
        // ============================================
        function initAudio() {
            notificationAudio = document.getElementById('notificationSound');
            if (notificationAudio) {
                notificationAudio.volume = 0.5;
            }
            
            const savedSound = localStorage.getItem('notificationSound');
            if (savedSound !== null) {
                soundEnabled = savedSound === 'true';
                document.getElementById('soundToggle').checked = soundEnabled;
            }
        }
        
        function playNotificationSound() {
            if (soundEnabled && notificationAudio) {
                notificationAudio.play().catch(e => console.log('Audio play failed:', e));
            }
        }
        
        document.getElementById('soundToggle')?.addEventListener('change', (e) => {
            soundEnabled = e.target.checked;
            localStorage.setItem('notificationSound', soundEnabled);
        });
        
        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <span>${message}</span>
                <i class="fas fa-times ml-3 cursor-pointer opacity-70 hover:opacity-100" onclick="this.parentElement.remove()"></i>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }
        
        // ============================================
        // FORMAT DATE
        // ============================================
        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            if (timestamp.toDate) {
                const date = timestamp.toDate();
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(diff / 3600000);
                const days = Math.floor(diff / 86400000);
                
                if (minutes < 1) return 'Just now';
                if (minutes < 60) return `${minutes} minute${minutes !== 1 ? 's' : ''} ago`;
                if (hours < 24) return `${hours} hour${hours !== 1 ? 's' : ''} ago`;
                if (days < 7) return `${days} day${days !== 1 ? 's' : ''} ago`;
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
            return 'N/A';
        }
        
        // ============================================
        // LOAD NOTIFICATIONS
        // ============================================
        async function loadNotifications() {
            if (!currentUser) return;
            
            const container = document.getElementById('notificationsList');
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="spinner mx-auto mb-4"></div>
                    <p class="text-gray-500">Loading notifications...</p>
                </div>
            `;
            
            try {
                const snapshot = await db.collection('notifications')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                allNotifications = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                updateStats();
                if(allNotifications.length === 0) showEmptyState('notificationsList', 'notifications');
                else { clearEmptyState('notificationsList'); renderNotifications(); }
                setupRealtimeListener();
                
            } catch (error) {
                console.error('Error loading notifications:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-3"></i>
                        <p class="text-gray-500">Failed to load notifications</p>
                        <button onclick="loadNotifications()" class="btn-primary mt-4">Try Again</button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // UPDATE STATS
        // ============================================
        function updateStats() {
            const unread = allNotifications.filter(n => !n.read).length;
            const read = allNotifications.filter(n => n.read).length;
            const promo = allNotifications.filter(n => n.type === 'promo').length;
            
            document.getElementById('unreadCount').innerText = unread;
            document.getElementById('totalCount').innerText = allNotifications.length;
            document.getElementById('readCount').innerText = read;
            document.getElementById('promoCount').innerText = promo;
        }
        
        // ============================================
        // RENDER NOTIFICATIONS
        // ============================================
        function renderNotifications() {
            let filtered = [...allNotifications];
            
            // Apply filter
            if (currentFilter !== 'all') {
                if (currentFilter === 'unread') {
                    filtered = filtered.filter(n => !n.read);
                } else {
                    filtered = filtered.filter(n => n.type === currentFilter);
                }
            }
            
            // Apply search
            if (currentSearch) {
                const searchLower = currentSearch.toLowerCase();
                filtered = filtered.filter(n => 
                    (n.title && n.title.toLowerCase().includes(searchLower)) ||
                    (n.message && n.message.toLowerCase().includes(searchLower))
                );
            }
            
            // Pagination
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(start, start + itemsPerPage);
            
            const container = document.getElementById('notificationsList');
            
            if (paginated.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bell-slash"></i>
                        <h3 class="text-lg font-semibold mb-2">No notifications found</h3>
                        <p class="text-gray-500">${currentSearch ? 'Try a different search term' : 'You\'re all caught up!'}</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            container.innerHTML = paginated.map(notif => {
                const iconClass = getIconClass(notif.type);
                const icon = getIcon(notif.type);
                const isUnread = !notif.read;
                
                return `
                    <div class="notification-card ${isUnread ? 'unread' : 'read'}" onclick="viewNotification('${notif.id}')">
                        <div class="flex gap-4">
                            <div class="notif-icon ${iconClass}">
                                <i class="fas ${icon} text-xl"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start flex-wrap gap-2">
                                    <h4 class="font-semibold ${isUnread ? 'text-primary' : ''}">${escapeHtml(notif.title)}</h4>
                                    <span class="text-xs text-gray-400">${formatDate(notif.createdAt)}</span>
                                </div>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${escapeHtml(notif.message.substring(0, 100))}${notif.message.length > 100 ? '...' : ''}</p>
                                <div class="flex gap-3 mt-2">
                                    <button class="action-btn" onclick="event.stopPropagation(); markAsRead('${notif.id}')">
                                        <i class="fas fa-check mr-1"></i> Mark as Read
                                    </button>
                                    <button class="action-btn" onclick="event.stopPropagation(); deleteNotification('${notif.id}')">
                                        <i class="fas fa-trash-alt mr-1"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            renderPagination(totalPages);
        }
        
        function getIconClass(type) {
            switch(type) {
                case 'order': return 'icon-order';
                case 'payment': return 'icon-payment';
                case 'ticket': return 'icon-ticket';
                case 'promo': return 'icon-promo';
                default: return 'icon-system';
            }
        }
        
        function getIcon(type) {
            switch(type) {
                case 'order': return 'fa-shopping-cart';
                case 'payment': return 'fa-wallet';
                case 'ticket': return 'fa-ticket-alt';
                case 'promo': return 'fa-gift';
                default: return 'fa-bell';
            }
        }
        
        // ============================================
        // RENDER PAGINATION
        // ============================================
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = `
                <button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
            `;
            
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            if (startPage > 1) {
                html += `<button class="pagination-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) html += `<span class="px-2">...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${currentPage === i ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="px-2">...</span>`;
                html += `<button class="pagination-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }
            
            html += `
                <button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            `;
            
            container.innerHTML = html;
        }
        
        window.changePage = function(page) {
            currentPage = page;
            renderNotifications();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        
        // ============================================
        // VIEW NOTIFICATION
        // ============================================
        window.viewNotification = async function(notifId) {
            const notif = allNotifications.find(n => n.id === notifId);
            if (!notif) return;
            
            document.getElementById('modalTitle').innerHTML = notif.title;
            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center gap-3 pb-3 border-b border-gray-200 dark:border-gray-700">
                        <div class="notif-icon ${getIconClass(notif.type)}">
                            <i class="fas ${getIcon(notif.type)} text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400">${formatDate(notif.createdAt)}</p>
                            <p class="text-sm text-gray-500">Type: ${notif.type}</p>
                        </div>
                    </div>
                    <p class="text-gray-600 dark:text-gray-300 leading-relaxed">${escapeHtml(notif.message)}</p>
                </div>
            `;
            
            const markReadBtn = document.getElementById('modalMarkReadBtn');
            if (notif.read) {
                markReadBtn.style.display = 'none';
            } else {
                markReadBtn.style.display = 'flex';
                markReadBtn.onclick = () => {
                    markAsRead(notifId);
                    closeModal();
                };
            }
            
            document.getElementById('notificationModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            // Mark as read when viewed
            if (!notif.read) {
                await markAsRead(notifId);
            }
        };
        
        // ============================================
        // MARK AS READ
        // ============================================
        window.markAsRead = async function(notifId) {
            try {
                await db.collection('notifications').doc(notifId).update({
                    read: true,
                    readAt: new Date()
                });
                
                const index = allNotifications.findIndex(n => n.id === notifId);
                if (index !== -1) {
                    allNotifications[index].read = true;
                    updateStats();
                    renderNotifications();
                }
                
                showToast('Notification marked as read', 'success');
                
            } catch (error) {
                console.error('Error marking as read:', error);
                showToast('Failed to mark as read', 'error');
            }
        };
        
        // ============================================
        // DELETE NOTIFICATION
        // ============================================
        window.deleteNotification = async function(notifId) {
            if (!confirm('Delete this notification?')) return;
            
            try {
                await db.collection('notifications').doc(notifId).delete();
                allNotifications = allNotifications.filter(n => n.id !== notifId);
                updateStats();
                renderNotifications();
                showToast('Notification deleted', 'success');
                
            } catch (error) {
                console.error('Error deleting notification:', error);
                showToast('Failed to delete notification', 'error');
            }
        };
        
        // ============================================
        // MARK ALL AS READ
        // ============================================
        document.getElementById('markAllReadBtn')?.addEventListener('click', async () => {
            const unreadNotifs = allNotifications.filter(n => !n.read);
            if (unreadNotifs.length === 0) {
                showToast('No unread notifications', 'info');
                return;
            }
            
            const btn = document.getElementById('markAllReadBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0 auto;"></div>';
            
            try {
                const batch = db.batch();
                unreadNotifs.forEach(notif => {
                    const ref = db.collection('notifications').doc(notif.id);
                    batch.update(ref, { read: true, readAt: new Date() });
                });
                await batch.commit();
                
                allNotifications.forEach(n => { n.read = true; });
                updateStats();
                renderNotifications();
                showToast(`Marked ${unreadNotifs.length} notifications as read`, 'success');
                
            } catch (error) {
                console.error('Error marking all as read:', error);
                showToast('Failed to mark all as read', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
        
        // ============================================
        // DELETE ALL NOTIFICATIONS
        // ============================================
        document.getElementById('deleteAllBtn')?.addEventListener('click', () => {
            if (allNotifications.length === 0) {
                showToast('No notifications to delete', 'info');
                return;
            }
            document.getElementById('deleteModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });
        
        document.getElementById('confirmDeleteBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('confirmDeleteBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0 auto;"></div>';
            
            try {
                const batch = db.batch();
                allNotifications.forEach(notif => {
                    const ref = db.collection('notifications').doc(notif.id);
                    batch.delete(ref);
                });
                await batch.commit();
                
                allNotifications = [];
                updateStats();
                renderNotifications();
                showToast('All notifications cleared', 'success');
                closeDeleteModal();
                
            } catch (error) {
                console.error('Error deleting all:', error);
                showToast('Failed to clear notifications', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
        
        // ============================================
        // SETUP REALTIME LISTENER
        // ============================================
        function setupRealtimeListener() {
            if (!currentUser) return;
            
            db.collection('notifications')
                .where('userId', '==', currentUser.uid)
                .orderBy('createdAt', 'desc')
                .onSnapshot((snapshot) => {
                    let hasNew = false;
                    
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const newNotif = { id: change.doc.id, ...change.doc.data() };
                            allNotifications.unshift(newNotif);
                            hasNew = true;
                            
                            // Play sound for new notification
                            if (!newNotif.read) {
                                playNotificationSound();
                                showDesktopNotification(newNotif.title, newNotif.message);
                            }
                        } else if (change.type === 'modified') {
                            const index = allNotifications.findIndex(n => n.id === change.doc.id);
                            if (index !== -1) {
                                allNotifications[index] = { id: change.doc.id, ...change.doc.data() };
                            }
                        } else if (change.type === 'removed') {
                            allNotifications = allNotifications.filter(n => n.id !== change.doc.id);
                        }
                    });
                    
                    if (hasNew) {
                        updateStats();
                        renderNotifications();
                        showToast('New notification received!', 'info');
                    } else {
                        updateStats();
                        renderNotifications();
                    }
                });
        }
        
        // ============================================
        // DESKTOP NOTIFICATION
        // ============================================
        function showDesktopNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, {
                    body: body,
                    icon: '/favicon.ico',
                    silent: true
                });
            }
        }
        
        // Request notification permission
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => {
                    Notification.requestPermission();
                }, 5000);
            }
        }
        
        // ============================================
        // CLOSE MODALS
        // ============================================
        window.closeModal = function() {
            document.getElementById('notificationModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
        
        window.closeDeleteModal = function() {
            document.getElementById('deleteModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
        
        // ============================================
        // ESCAPE HTML
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                renderNotifications();
            });
        });
        
        let searchTimeout;
        document.getElementById('searchNotifications')?.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = e.target.value;
                currentPage = 1;
                renderNotifications();
            }, 300);
        });
        
        document.getElementById('refreshNotificationsBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('refreshNotificationsBtn');
            btn.innerHTML = '<i class="fas fa-sync-alt fa-spin mr-2"></i> Refreshing...';
            await loadNotifications();
            btn.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> Refresh';
            showToast('Notifications refreshed!', 'success');
        });
        
        // ============================================
        // AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/public/pages/public/login.html';
                return;
            }
            
            currentUser = user;
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().isAdmin === true) {
                window.location.href = '/admin/index.html';
                return;
            }
            
            initAudio();
            await loadNotifications();
            requestNotificationPermission();
        });
        // ============================================
        // DARK MODE
        // ============================================
        const darkModeToggle = document.getElementById('darkModeToggle');
        if (darkModeToggle) {
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });
        }
        
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
        
        console.log('✅ Notifications page loaded');
    </script>

            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
        }
    </style>

<script>
// Global logout fix - ensures logout works everywhere
(function fixLogout(){
    const checkInterval = setInterval(() => {
        const logoutBtn = document.getElementById('logoutBtn') || document.getElementById('sidebarLogoutBtn');
        if(logoutBtn && typeof firebase !== 'undefined' && firebase.auth){
            clearInterval(checkInterval);
            logoutBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                firebase.auth().signOut()
                    .then(() => { window.location.href = '/public/pages/public/login.html'; })
                    .catch(err => { console.error('Logout error:', err); alert('Logout failed. Please try again.'); });
            };
        }
    }, 500);
})();

<button id="darkModeToggle" class="dark-mode-toggle-btn">
    <i class="fas fa-moon"></i>
</button>
<script>
document.getElementById('darkModeToggle')?.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
    const icon = document.querySelector('#darkModeToggle i');
    if(icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
});
if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
</script>
