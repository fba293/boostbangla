<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details | BoostBangla Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#FF6B00', primaryDark: '#CC5500', darkBg: '#02101A' },
                    fontFamily: { inter: ['Inter', 'sans-serif'], bangla: ['Noto Sans Bengali', 'Inter', 'sans-serif'] }
                }
            }
        };
    </script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <link rel="stylesheet" href="/css/admin.css">
    
    <style>
        .info-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e5e7eb;
            transition: all 0.2s;
        }
        body.dark-mode .info-card {
            background: #1e293b;
            border-color: #334155;
        }
        
        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .info-label {
            width: 140px;
            font-weight: 500;
            color: #6b7280;
        }
        .info-value {
            flex: 1;
            color: #1f2937;
            font-weight: 500;
        }
        body.dark-mode .info-row { border-bottom-color: #334155; }
        body.dark-mode .info-label { color: #94a3b8; }
        body.dark-mode .info-value { color: #e2e8f0; }
        
        .status-active {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #d1fae5;
            color: #059669;
        }
        .status-suspended {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #fee2e2;
            color: #dc2626;
        }
        body.dark-mode .status-active { background: #064e3b; color: #34d399; }
        body.dark-mode .status-suspended { background: #7f1d1d; color: #f87171; }
        
        .order-item {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .order-item:hover {
            background: #fef9f5;
            transform: translateX(2px);
        }
        body.dark-mode .order-item:hover {
            background: #2d1a0f;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-processing { background: #dbeafe; color: #2563eb; }
        .badge-completed { background: #d1fae5; color: #059669; }
        .badge-cancelled { background: #fee2e2; color: #dc2626; }
        body.dark-mode .badge-pending { background: #78350f; color: #fbbf24; }
        body.dark-mode .badge-processing { background: #1e3a5f; color: #60a5fa; }
        body.dark-mode .badge-completed { background: #064e3b; color: #34d399; }
        body.dark-mode .badge-cancelled { background: #7f1d1d; color: #f87171; }
        
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .action-edit { background: #dbeafe; color: #2563eb; }
        .action-edit:hover { background: #bfdbfe; }
        .action-suspend { background: #fee2e2; color: #dc2626; }
        .action-suspend:hover { background: #fecaca; }
        .action-delete { background: #fef3c7; color: #d97706; }
        .action-delete:hover { background: #fde68a; }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF6B00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }
        body.dark-mode .modal-content {
            background: #1e293b;
        }
        
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
        }
        body.dark-mode .form-input {
            background: #0f172a;
            border-color: #334155;
            color: #e2e8f0;
        }
        
        @media (max-width: 768px) {
            .info-row { flex-direction: column; gap: 6px; }
            .info-label { width: 100%; }
            .action-buttons { flex-direction: column; }
            .action-buttons .action-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Admin Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="/admin/index.html" class="logo">Boost<span>Bangla</span></a>
                <p class="text-xs text-gray-400 mt-2">Admin Panel</p>
            </div>
            <nav class="admin-sidebar-nav">
                <a href="/admin/index.html" class="admin-nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="admin-nav-item active">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="/admin/deposits.html" class="admin-nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Deposits</span>
                </a>
                <a href="/admin/orders.html" class="admin-nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Orders</span>
                </a>
                <a href="/admin/tickets.html" class="admin-nav-item">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Tickets</span>
                </a>
                <a href="/admin/refunds.html" class="admin-nav-item">
                    <i class="fas fa-hand-holding-usd"></i>
                    <span>Refunds</span>
                </a>
                <a href="/admin/withdrawals.html" class="admin-nav-item">
                    <i class="fas fa-arrow-up"></i>
                    <span>Withdrawals</span>
                </a>
                <div class="admin-nav-divider"></div>
                <a href="/admin/services.html" class="admin-nav-item">
                    <i class="fas fa-layer-group"></i>
                    <span>Services</span>
                </a>
                <a href="/admin/settings.html" class="admin-nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <div class="admin-nav-divider"></div>
                <a href="/dashboard/index.html" class="admin-nav-item">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Site</span>
                </a>
                <button id="adminLogoutBtn" class="admin-nav-item w-full text-left text-red-400">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </nav>
        </aside>
        
        <!-- Admin Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <div>
                    <h1>User Details</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">View and manage user information</p>
                </div>
                <div class="admin-header-actions">
                    <button id="adminDarkModeToggle" class="admin-dark-mode-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="admin-user-info">
                        <div class="admin-avatar">A</div>
                        <span class="hidden md:inline">Admin</span>
                    </div>
                </div>
            </div>
            
            <div id="userContent">
                <div class="text-center py-12">
                    <div class="spinner"></div>
                    <p class="text-gray-500 dark:text-gray-400 mt-3">Loading user details...</p>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Mobile Menu Button -->
    <button id="adminMobileMenuBtn" class="admin-mobile-menu-btn">
        <i class="fas fa-bars text-xl"></i>
    </button>
    
    <!-- Edit Balance Modal -->
    <div id="editBalanceModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Update Balance</h3>
                <button onclick="closeEditBalanceModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="editBalanceForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Amount (BDT)</label>
                    <input type="number" id="balanceAmount" class="form-input" step="0.01" required>
                    <p class="text-xs text-gray-400 mt-1">Enter positive amount to add, negative to deduct</p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Reason / Note</label>
                    <textarea id="balanceNote" rows="2" class="form-input" placeholder="Reason for balance adjustment..."></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeEditBalanceModal()" class="flex-1 border border-gray-300 py-2 rounded-lg hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="flex-1 btn-primary">Update Balance</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDypaa-pHjEc4rrXHrtj8i_8vgo_5XMY9g",
            authDomain: "boostbangla-629a1.firebaseapp.com",
            projectId: "boostbangla-629a1",
            storageBucket: "boostbangla-629a1.firebasestorage.app",
            messagingSenderId: "384867462668",
            appId: "1:384867462668:web:bbc79c6a7ead66b439c829"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let userId = null;
        let userData = null;
        
        // ============================================
        // GET USER ID FROM URL
        // ============================================
        function getUserIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }
        
        // ============================================
        // CHECK ADMIN AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (!userDoc.exists || !userDoc.data().isAdmin) {
                window.location.href = '/dashboard/index.html';
                return;
            }
            
            userId = getUserIdFromUrl();
            if (!userId) {
                window.location.href = '/admin/users.html';
                return;
            }
            
            await loadUserDetails();
            await loadUserOrders();
            await loadUserDeposits();
            await loadUserTickets();
        });
        
        // ============================================
        // LOAD USER DETAILS
        // ============================================
        async function loadUserDetails() {
            const container = document.getElementById('userContent');
            
            try {
                const userDoc = await db.collection('users').doc(userId).get();
                
                if (!userDoc.exists) {
                    container.innerHTML = `
                        <div class="info-card text-center py-12">
                            <i class="fas fa-user-slash text-5xl text-gray-400 mb-4"></i>
                            <h2 class="text-2xl font-bold mb-2">User Not Found</h2>
                            <p class="text-gray-500 mb-4">The user you're looking for doesn't exist.</p>
                            <a href="/admin/users.html" class="btn-primary inline-block">Back to Users</a>
                        </div>
                    `;
                    return;
                }
                
                userData = { id: userDoc.id, ...userDoc.data() };
                
                const isActive = userData.isActive !== false;
                const isAdmin = userData.isAdmin || false;
                const createdAt = userData.createdAt?.toDate ? userData.createdAt.toDate().toLocaleDateString() : 'N/A';
                
                container.innerHTML = `
                    <!-- User Info Card -->
                    <div class="info-card">
                        <div class="flex justify-between items-start flex-wrap gap-4 mb-4">
                            <div>
                                <h2 class="text-2xl font-bold">${escapeHtml(userData.username || 'N/A')}</h2>
                                <p class="text-gray-500">${escapeHtml(userData.email || 'N/A')}</p>
                            </div>
                            <div class="flex gap-2">
                                <span class="${isActive ? 'status-active' : 'status-suspended'}">${isActive ? 'Active' : 'Suspended'}</span>
                                ${isAdmin ? '<span class="role-badge role-admin">Admin</span>' : ''}
                            </div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-label">User ID</div>
                            <div class="info-value font-mono">${userId}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Balance</div>
                            <div class="info-value text-primary font-bold text-xl">৳${(userData.balance || 0).toLocaleString()}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Member Since</div>
                            <div class="info-value">${createdAt}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Total Orders</div>
                            <div class="info-value" id="totalOrders">Loading...</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Total Spent</div>
                            <div class="info-value" id="totalSpent">Loading...</div>
                        </div>
                        
                        <div class="flex gap-3 mt-6 action-buttons">
                            <button onclick="openEditBalanceModal()" class="action-btn action-edit"><i class="fas fa-money-bill-wave mr-1"></i> Adjust Balance</button>
                            <button onclick="toggleUserStatus()" class="action-btn action-suspend"><i class="fas ${isActive ? 'fa-ban' : 'fa-check-circle'} mr-1"></i> ${isActive ? 'Suspend User' : 'Activate User'}</button>
                            ${!isAdmin ? `<button onclick="deleteUser()" class="action-btn action-delete"><i class="fas fa-trash-alt mr-1"></i> Delete User</button>` : ''}
                        </div>
                    </div>
                    
                    <!-- Orders Section -->
                    <div class="info-card">
                        <h3 class="text-xl font-bold mb-4"><i class="fas fa-shopping-cart text-primary mr-2"></i> Order History</h3>
                        <div id="ordersList" class="space-y-2">
                            <div class="text-center py-4"><div class="spinner"></div><p>Loading orders...</p></div>
                        </div>
                    </div>
                    
                    <!-- Deposits Section -->
                    <div class="info-card">
                        <h3 class="text-xl font-bold mb-4"><i class="fas fa-money-bill-wave text-primary mr-2"></i> Deposit History</h3>
                        <div id="depositsList" class="space-y-2">
                            <div class="text-center py-4"><div class="spinner"></div><p>Loading deposits...</p></div>
                        </div>
                    </div>
                    
                    <!-- Tickets Section -->
                    <div class="info-card">
                        <h3 class="text-xl font-bold mb-4"><i class="fas fa-ticket-alt text-primary mr-2"></i> Support Tickets</h3>
                        <div id="ticketsList" class="space-y-2">
                            <div class="text-center py-4"><div class="spinner"></div><p>Loading tickets...</p></div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error loading user:', error);
                container.innerHTML = '<div class="text-center py-12 text-red-500">❌ Failed to load user details</div>';
            }
        }
        
        // ============================================
        // LOAD USER ORDERS
        // ============================================
        async function loadUserOrders() {
            const container = document.getElementById('ordersList');
            if (!container) return;
            
            try {
                const ordersSnapshot = await db.collection('orders')
                    .where('userId', '==', userId)
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();
                
                let totalSpent = 0;
                let html = '';
                
                if (ordersSnapshot.empty) {
                    html = '<div class="text-center py-8 text-gray-500">No orders found</div>';
                } else {
                    html = '<div class="space-y-2">';
                    ordersSnapshot.forEach(doc => {
                        const order = doc.data();
                        totalSpent += order.priceBDT || 0;
                        const date = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleString() : 'N/A';
                        
                        html += `
                            <div class="order-item p-3 bg-gray-50 dark:bg-gray-800 rounded-lg cursor-pointer" onclick="window.location.href='/admin/orders.html?id=${doc.id}'">
                                <div class="flex justify-between items-center flex-wrap gap-2">
                                    <div>
                                        <div class="font-mono text-sm text-primary">#${doc.id.substring(0, 8)}</div>
                                        <div class="text-xs text-gray-400">${date}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="font-semibold">৳${(order.priceBDT || 0).toLocaleString()}</div>
                                        <div class="text-xs"><span class="status-badge badge-${order.status}">${order.status}</span></div>
                                    </div>
                                </div>
                                <div class="text-sm text-gray-500 mt-1">${escapeHtml(order.serviceName?.substring(0, 50) || 'N/A')}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                container.innerHTML = html;
                
                // Update total spent in user info
                const totalSpentEl = document.getElementById('totalSpent');
                if (totalSpentEl) totalSpentEl.innerHTML = `৳${totalSpent.toLocaleString()}`;
                
                const totalOrdersEl = document.getElementById('totalOrders');
                if (totalOrdersEl) totalOrdersEl.innerText = ordersSnapshot.size;
                
            } catch (error) {
                console.error('Error loading orders:', error);
                container.innerHTML = '<div class="text-center py-8 text-red-500">Failed to load orders</div>';
            }
        }
        
        // ============================================
        // LOAD USER DEPOSITS
        // ============================================
        async function loadUserDeposits() {
            const container = document.getElementById('depositsList');
            if (!container) return;
            
            try {
                const depositsSnapshot = await db.collection('deposits')
                    .where('userId', '==', userId)
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();
                
                if (depositsSnapshot.empty) {
                    container.innerHTML = '<div class="text-center py-8 text-gray-500">No deposits found</div>';
                    return;
                }
                
                let html = '<div class="space-y-2">';
                depositsSnapshot.forEach(doc => {
                    const deposit = doc.data();
                    const date = deposit.createdAt?.toDate ? deposit.createdAt.toDate().toLocaleString() : 'N/A';
                    let statusClass = '';
                    if (deposit.status === 'approved') statusClass = 'badge-completed';
                    else if (deposit.status === 'pending') statusClass = 'badge-pending';
                    else statusClass = 'badge-cancelled';
                    
                    html += `
                        <div class="p-3 bg-gray-50 dark:bg-gray-800 rounded-lg">
                            <div class="flex justify-between items-center flex-wrap gap-2">
                                <div>
                                    <div class="font-semibold text-primary">৳${(deposit.amountBDT || 0).toLocaleString()}</div>
                                    <div class="text-xs text-gray-400">${date}</div>
                                </div>
                                <div class="text-right">
                                    <div><span class="status-badge ${statusClass}">${deposit.status}</span></div>
                                    <div class="text-xs text-gray-400 mt-1">${deposit.method?.toUpperCase() || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="text-xs text-gray-400 mt-1">TXID: ${deposit.transactionId || 'N/A'}</div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading deposits:', error);
                container.innerHTML = '<div class="text-center py-8 text-red-500">Failed to load deposits</div>';
            }
        }
        
        // ============================================
        // LOAD USER TICKETS
        // ============================================
        async function loadUserTickets() {
            const container = document.getElementById('ticketsList');
            if (!container) return;
            
            try {
                const ticketsSnapshot = await db.collection('tickets')
                    .where('userId', '==', userId)
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();
                
                if (ticketsSnapshot.empty) {
                    container.innerHTML = '<div class="text-center py-8 text-gray-500">No tickets found</div>';
                    return;
                }
                
                let html = '<div class="space-y-2">';
                ticketsSnapshot.forEach(doc => {
                    const ticket = doc.data();
                    const date = ticket.createdAt?.toDate ? ticket.createdAt.toDate().toLocaleString() : 'N/A';
                    const statusClass = ticket.status === 'closed' ? 'badge-completed' : 'badge-pending';
                    
                    html += `
                        <div class="order-item p-3 bg-gray-50 dark:bg-gray-800 rounded-lg cursor-pointer" onclick="window.location.href='/admin/tickets.html?id=${doc.id}'">
                            <div class="flex justify-between items-center flex-wrap gap-2">
                                <div>
                                    <div class="font-medium">${escapeHtml(ticket.subject || 'N/A')}</div>
                                    <div class="text-xs text-gray-400">${date}</div>
                                </div>
                                <div>
                                    <span class="status-badge ${statusClass}">${ticket.status}</span>
                                </div>
                            </div>
                            <div class="text-xs text-gray-400 mt-1">Priority: ${ticket.priority || 'low'}</div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading tickets:', error);
                container.innerHTML = '<div class="text-center py-8 text-red-500">Failed to load tickets</div>';
            }
        }
        
        // ============================================
        // EDIT BALANCE MODAL
        // ============================================
        function openEditBalanceModal() {
            document.getElementById('balanceAmount').value = '';
            document.getElementById('balanceNote').value = '';
            document.getElementById('editBalanceModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        
        function closeEditBalanceModal() {
            document.getElementById('editBalanceModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        
        document.getElementById('editBalanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = parseFloat(document.getElementById('balanceAmount').value);
            const note = document.getElementById('balanceNote').value;
            
            if (isNaN(amount) || amount === 0) {
                alert('Please enter a valid amount');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Updating...';
            
            try {
                await db.collection('users').doc(userId).update({
                    balance: firebase.firestore.FieldValue.increment(amount),
                    updatedAt: new Date()
                });
                
                // Log the transaction
                await db.collection('adminActions').add({
                    userId: userId,
                    action: 'balance_adjustment',
                    amount: amount,
                    note: note,
                    adminId: auth.currentUser.uid,
                    createdAt: new Date()
                });
                
                showToast(`Balance updated by ৳${amount.toLocaleString()}`, 'success');
                closeEditBalanceModal();
                await loadUserDetails();
                await loadUserOrders();
                
            } catch (error) {
                console.error('Error updating balance:', error);
                showToast('Failed to update balance', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
        
        // ============================================
        // TOGGLE USER STATUS
        // ============================================
        window.toggleUserStatus = async () => {
            const isActive = userData?.isActive !== false;
            const action = isActive ? 'suspend' : 'activate';
            const confirmed = confirm(`Are you sure you want to ${action} this user?`);
            if (!confirmed) return;
            
            try {
                await db.collection('users').doc(userId).update({
                    isActive: !isActive,
                    updatedAt: new Date()
                });
                
                showToast(`User ${action}d successfully!`, 'success');
                await loadUserDetails();
                
            } catch (error) {
                console.error('Error toggling user status:', error);
                showToast(`Failed to ${action} user`, 'error');
            }
        };
        
        // ============================================
        // DELETE USER
        // ============================================
        window.deleteUser = async () => {
            const confirmed = confirm('⚠️ WARNING: This will permanently delete this user and ALL their data. This action cannot be undone. Are you absolutely sure?');
            if (!confirmed) return;
            
            try {
                // Delete user document
                await db.collection('users').doc(userId).delete();
                
                showToast('User deleted successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/admin/users.html';
                }, 1500);
                
            } catch (error) {
                console.error('Error deleting user:', error);
                showToast('Failed to delete user', 'error');
            }
        };
        
        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(message, type) {
            alert(message);
        }
        
        // ============================================
        // DARK MODE AND MOBILE TOGGLE
        // ============================================
        const adminDarkToggle = document.getElementById('adminDarkModeToggle');
        if (adminDarkToggle) {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) document.body.classList.add('dark-mode');
            adminDarkToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });
        }
        
        const adminMobileBtn = document.getElementById('adminMobileMenuBtn');
        const adminSidebar = document.querySelector('.admin-sidebar');
        if (adminMobileBtn && adminSidebar) {
            adminMobileBtn.addEventListener('click', () => {
                adminSidebar.classList.toggle('open');
            });
        }
        
        document.getElementById('adminLogoutBtn')?.addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = '/login.html';
        });
        
        // Close modal on outside click
        const editModal = document.getElementById('editBalanceModal');
        if (editModal) {
            editModal.addEventListener('click', (e) => {
                if (e.target === editModal) closeEditBalanceModal();
            });
        }
    </script>
    <!-- Universal Notifications Helper -->
<script src="/js/core/notifications-helper.js"></script>
</body>
