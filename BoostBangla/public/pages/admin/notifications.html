<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notifications | BoostBangla Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#FF6B00', primaryDark: '#CC5500', darkBg: '#02101A' },
                    fontFamily: { inter: ['Inter', 'sans-serif'], bangla: ['Noto Sans Bengali', 'Inter', 'sans-serif'] }
                }
            }
        };
    </script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <link rel="stylesheet" href="/css/admin.css">
    
    <style>
        .admin-notification-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
            transition: all 0.2s;
            cursor: pointer;
        }
        .admin-notification-card:hover {
            border-color: #FF6B00;
            transform: translateX(2px);
        }
        .admin-notification-card.unread {
            background: #fff8f0;
            border-left: 4px solid #FF6B00;
        }
        body.dark-mode .admin-notification-card {
            background: #1e293b;
            border-color: #334155;
        }
        body.dark-mode .admin-notification-card.unread {
            background: #2d1a0f;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            border: 1px solid #e5e7eb;
            color: #6b7280;
        }
        .filter-btn.active {
            background: #FF6B00;
            color: white;
            border-color: #FF6B00;
        }
        body.dark-mode .filter-btn {
            background: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }
        body.dark-mode .filter-btn.active {
            background: #FF6B00;
            color: white;
        }
        
        .pagination-btn {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .pagination-btn:hover { border-color: #FF6B00; color: #FF6B00; }
        .pagination-btn.active { background: #FF6B00; color: white; border-color: #FF6B00; }
        body.dark-mode .pagination-btn { background: #1e293b; border-color: #334155; color: #94a3b8; }
        body.dark-mode .pagination-btn.active { background: #FF6B00; color: white; }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }
        body.dark-mode .modal-content {
            background: #1e293b;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Admin Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="/admin/index.html" class="logo">Boost<span>Bangla</span></a>
                <p class="text-xs text-gray-400 mt-2">Admin Panel</p>
            </div>
            <nav class="admin-sidebar-nav">
                <a href="/admin/index.html" class="admin-nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="admin-nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="/admin/deposits.html" class="admin-nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Deposits</span>
                </a>
                <a href="/admin/orders.html" class="admin-nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Orders</span>
                </a>
                <a href="/admin/notifications.html" class="admin-nav-item active">
                    <i class="fas fa-bell"></i>
                    <span>Notifications</span>
                </a>
                <a href="/admin/tickets.html" class="admin-nav-item">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Tickets</span>
                </a>
                <a href="/admin/refunds.html" class="admin-nav-item">
                    <i class="fas fa-hand-holding-usd"></i>
                    <span>Refunds</span>
                </a>
                <div class="admin-nav-divider"></div>
                <a href="/dashboard/index.html" class="admin-nav-item">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Site</span>
                </a>
                <button id="adminLogoutBtn" class="admin-nav-item w-full text-left text-red-400">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </nav>
        </aside>
        
        <!-- Admin Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <div>
                    <h1>Admin Notifications</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">System alerts, user activities, and important updates</p>
                </div>
                <div class="admin-header-actions">
                    <button id="adminDarkModeToggle" class="admin-dark-mode-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="admin-user-info">
                        <div class="admin-avatar">A</div>
                        <span class="hidden md:inline">Admin</span>
                    </div>
                </div>
            </div>
            
            <!-- Stats Summary -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700">
                    <div class="text-sm text-gray-500">Total Alerts</div>
                    <div class="text-2xl font-bold" id="totalAlerts">0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700">
                    <div class="text-sm text-gray-500">Unread</div>
                    <div class="text-2xl font-bold text-yellow-600" id="unreadAlerts">0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700">
                    <div class="text-sm text-gray-500">New Orders Today</div>
                    <div class="text-2xl font-bold text-primary" id="newOrdersToday">0</div>
                </div>
            </div>
            
            <!-- Filters -->
            <div class="filters flex gap-2 mb-6 flex-wrap">
                <button class="filter-btn active" data-filter="all">📋 All</button>
                <button class="filter-btn" data-filter="order">📦 New Orders</button>
                <button class="filter-btn" data-filter="deposit">💰 Deposits</button>
                <button class="filter-btn" data-filter="withdrawal">🏧 Withdrawals</button>
                <button class="filter-btn" data-filter="ticket">🎫 Tickets</button>
                <button class="filter-btn" data-filter="system">⚙️ System</button>
                <button class="filter-btn" data-filter="unread">🔴 Unread</button>
            </div>
            
            <!-- Notifications List -->
            <div id="adminNotificationsList" class="space-y-3">
                <div class="text-center py-12"><div class="spinner"></div><p class="text-gray-500 mt-2">Loading notifications...</p></div>
            </div>
            
            <!-- Pagination -->
            <div id="pagination" class="flex justify-center gap-2 mt-6 flex-wrap"></div>
        </main>
    </div>
    
    <!-- Mobile Menu Button -->
    <button id="adminMobileMenuBtn" class="admin-mobile-menu-btn">
        <i class="fas fa-bars text-xl"></i>
    </button>
    
    <!-- Notification Detail Modal -->
    <div id="notificationModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold" id="modalTitle">Notification</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="modalBody"></div>
            <button onclick="closeModal()" class="btn-primary w-full mt-4">Close</button>
        </div>
    </div>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDypaa-pHjEc4rrXHrtj8i_8vgo_5XMY9g",
            authDomain: "boostbangla-629a1.firebaseapp.com",
            projectId: "boostbangla-629a1",
            storageBucket: "boostbangla-629a1.firebasestorage.app",
            messagingSenderId: "384867462668",
            appId: "1:384867462668:web:bbc79c6a7ead66b439c829"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let allAdminNotifications = [];
        let currentFilter = 'all';
        let currentPage = 1;
        let realtimeListener = null;
        const ITEMS_PER_PAGE = 20;
        
        // ============================================
        // CHECK ADMIN AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (!userDoc.exists || !userDoc.data().isAdmin) {
                window.location.href = '/dashboard/index.html';
                return;
            }
            
            setupRealtimeListener();
            loadTodayStats();
        });
        
        // ============================================
        // SETUP REALTIME LISTENER FOR ADMIN
        // ============================================
        function setupRealtimeListener() {
            if (realtimeListener) realtimeListener();
            
            realtimeListener = db.collection('adminNotifications')
                .orderBy('createdAt', 'desc')
                .onSnapshot((snapshot) => {
                    allAdminNotifications = [];
                    snapshot.forEach((doc) => {
                        allAdminNotifications.push({ id: doc.id, ...doc.data() });
                    });
                    
                    const unreadCount = allAdminNotifications.filter(n => !n.read).length;
                    document.getElementById('unreadAlerts').innerText = unreadCount;
                    document.getElementById('totalAlerts').innerText = allAdminNotifications.length;
                    
                    displayNotifications();
                }, (error) => {
                    console.error('Realtime listener error:', error);
                });
        }
        
        // ============================================
        // LOAD TODAY'S STATS
        // ============================================
        async function loadTodayStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const ordersSnapshot = await db.collection('orders')
                .where('createdAt', '>=', today)
                .get();
            
            document.getElementById('newOrdersToday').innerText = ordersSnapshot.size;
        }
        
        // ============================================
        // DISPLAY NOTIFICATIONS
        // ============================================
        function displayNotifications() {
            let filtered = [...allAdminNotifications];
            
            if (currentFilter === 'unread') {
                filtered = filtered.filter(n => !n.read);
            } else if (currentFilter !== 'all') {
                filtered = filtered.filter(n => n.type === currentFilter);
            }
            
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageNotifications = filtered.slice(start, start + ITEMS_PER_PAGE);
            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            
            const container = document.getElementById('adminNotificationsList');
            if (!container) return;
            
            if (pageNotifications.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500"><i class="fas fa-bell-slash text-4xl mb-3 opacity-50"></i><p>No notifications</p></div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            container.innerHTML = pageNotifications.map(notif => `
                <div class="admin-notification-card ${notif.read ? '' : 'unread'}" onclick="viewNotification('${notif.id}')">
                    <div class="flex gap-4">
                        <div class="text-2xl">${getIconForType(notif.type)}</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start flex-wrap gap-2">
                                <h3 class="font-semibold ${!notif.read ? 'text-primary' : ''}">${escapeHtml(notif.title)}</h3>
                                <span class="text-xs text-gray-400">${formatDate(notif.createdAt)}</span>
                            </div>
                            <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">${escapeHtml(notif.message)}</p>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-xs text-gray-400">${notif.type}</span>
                                ${!notif.read ? '<span class="text-xs text-primary">● Unread</span>' : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            updatePagination(totalPages);
        }
        
        function getIconForType(type) {
            const icons = {
                order: '📦',
                deposit: '💰',
                withdrawal: '🏧',
                ticket: '🎫',
                system: '⚙️'
            };
            return icons[type] || '🔔';
        }
        
        // ============================================
        // VIEW NOTIFICATION DETAIL
        // ============================================
        window.viewNotification = async (notifId) => {
            const notif = allAdminNotifications.find(n => n.id === notifId);
            if (!notif) return;
            
            if (!notif.read) {
                await db.collection('adminNotifications').doc(notifId).update({ read: true });
            }
            
            document.getElementById('modalTitle').innerHTML = getIconForType(notif.type) + ' ' + escapeHtml(notif.title);
            document.getElementById('modalBody').innerHTML = `
                <p class="text-gray-700 dark:text-gray-300 leading-relaxed">${escapeHtml(notif.message)}</p>
                <div class="mt-4 pt-3 border-t dark:border-gray-700 text-xs text-gray-400">
                    Received: ${formatDate(notif.createdAt)}
                </div>
                ${notif.actionLink ? `<div class="mt-3"><a href="${notif.actionLink}" class="text-primary text-sm">Go to →</a></div>` : ''}
            `;
            document.getElementById('notificationModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeModal = function() {
            document.getElementById('notificationModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
        
        // ============================================
        // FILTER HANDLERS
        // ============================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                displayNotifications();
            });
        });
        
        // ============================================
        // PAGINATION
        // ============================================
        function updatePagination(totalPages) {
            const paginationDiv = document.getElementById('pagination');
            if (!paginationDiv) return;
            if (totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
            
            let html = `<button class="pagination-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled style="opacity:0.5"' : ''}>◀ Prev</button>`;
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="pagination-btn ${currentPage === i ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (totalPages > 5) html += `<span class="px-2">...</span><button class="pagination-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            html += `<button class="pagination-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled style="opacity:0.5"' : ''}>Next ▶</button>`;
            paginationDiv.innerHTML = html;
        }
        
        window.goToPage = function(page) {
            let filtered = [...allAdminNotifications];
            if (currentFilter === 'unread') filtered = filtered.filter(n => !n.read);
            else if (currentFilter !== 'all') filtered = filtered.filter(n => n.type === currentFilter);
            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            displayNotifications();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        
        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function formatDate(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================
        // DARK MODE AND MOBILE TOGGLE
        // ============================================
        const adminDarkToggle = document.getElementById('adminDarkModeToggle');
        if (adminDarkToggle) {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) document.body.classList.add('dark-mode');
            adminDarkToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });
        }
        
        const adminMobileBtn = document.getElementById('adminMobileMenuBtn');
        const adminSidebar = document.querySelector('.admin-sidebar');
        if (adminMobileBtn && adminSidebar) {
            adminMobileBtn.addEventListener('click', () => {
                adminSidebar.classList.toggle('open');
            });
        }
        
        document.getElementById('adminLogoutBtn')?.addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = '/login.html';
        });
        
        // Close modal on outside click
        const modal = document.getElementById('notificationModal');
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }
    </script>
    <!-- Universal Notifications Helper -->
<script src="/js/core/notifications-helper.js"></script>
</body>
</html>
