<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4D02;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF7ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEFE0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGradient)" stroke="url(#avatarGradient)" stroke-width="2"/>
  
  <!-- Head/Hair Base -->
  <circle cx="50" cy="40" r="22" fill="url(#avatarGradient)"/>
  
  <!-- Face -->
  <circle cx="50" cy="42" r="16" fill="#FFF7ED"/>
  
  <!-- Eyes -->
  <ellipse cx="42" cy="40" rx="3" ry="3.5" fill="#4B5563"/>
  <ellipse cx="58" cy="40" rx="3" ry="3.5" fill="#4B5563"/>
  
  <!-- Eye Highlights -->
  <circle cx="43" cy="38" r="1.2" fill="white"/>
  <circle cx="59" cy="38" r="1.2" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M37 35 Q42 32 47 35" stroke="#4B5563" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M53 35 Q58 32 63 35" stroke="#4B5563" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M42 49 Q50 56 58 49" stroke="#FF6B00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Blush / Cheeks -->
  <ellipse cx="36" cy="48" rx="4" ry="2.5" fill="#FF6B00" opacity="0.2"/>
  <ellipse cx="64" cy="48" rx="4" ry="2.5" fill="#FF6B00" opacity="0.2"/>
  
  <!-- Hair Details -->
  <path d="M28 40 Q28 25 50 18 Q72 25 72 40" fill="url(#avatarGradient)" opacity="0.3"/>
  
  <!-- Hair Strands -->
  <path d="M35 25 Q40 20 45 22" stroke="#CC4D02" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M55 22 Q60 20 65 25" stroke="#CC4D02" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M45 20 Q50 18 55 20" stroke="#CC4D02" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Simple Body/Shoulders -->
  <path d="M32 70 Q35 80 50 80 Q65 80 68 70" stroke="url(#avatarGradient)" stroke-width="2" fill="none"/>
  
  <!-- Small Decorative Elements -->
  <circle cx="28" cy="55" r="2" fill="#FF6B00" opacity="0.3"/>
  <circle cx="72" cy="55" r="2" fill="#FF6B00" opacity="0.3"/>
</svg>